<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>知識人脈庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface2: #f0eeea;
  --surface3: #e8e5df;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #1a1a18;
  --text2: #6b6860;
  --text3: #a8a49c;
  --accent: #2d7dd2;
  --accent2: #1a5fa8;
  --accent-glow: rgba(45,125,210,0.1);
  --green: #1a7a4a;
  --green-bg: #e6f4ed;
  --amber: #a06010;
  --amber-bg: #fdf0dc;
  --red: #c0392b;
  --red-bg: #fdecea;
  --blue: #1a5fa8;
  --blue-bg: #e8f0fb;
  --pink: #9b2d6e;
  --pink-bg: #fce8f3;
  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Noto Sans TC', sans-serif;
  --mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── Layout ── */
.app { display: flex; flex-direction: column; height: 100dvh; }
.topbar {
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky; top: 0; z-index: 50;
  flex-shrink: 0;
}
.topbar-logo { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
.topbar-logo span { color: var(--accent); }
.topbar-stats { font-size: 11px; color: var(--text3); font-family: var(--mono); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--text2); display: flex; align-items: center;
}
.icon-btn:hover { color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }

.main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 100px; }

.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 50;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; padding: 10px 4px 8px;
  font-size: 10px; color: var(--text3); cursor: pointer;
  transition: color .2s; border: none; background: none;
}
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; stroke-width: 1.8; }

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  transition: border-color .2s;
}
.card:active { border-color: var(--border2); }

.card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.avatar {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
  font-family: var(--mono);
  color: #fff;
}
.card-meta { flex: 1; min-width: 0; }
.card-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-role { font-size: 11px; color: var(--text2); margin-top: 1px; }
.card-date { font-size: 10px; color: var(--text3); font-family: var(--mono); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
.tag {
  font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500;
  font-family: var(--mono);
}
.tag-cat { background: var(--accent-glow); color: var(--accent); }
.tag-green { background: var(--green-bg); color: var(--green); }
.tag-amber { background: var(--amber-bg); color: var(--amber); }
.tag-red { background: var(--red-bg); color: var(--red); }
.tag-blue { background: var(--blue-bg); color: var(--blue); }
.tag-pink { background: var(--pink-bg); color: var(--pink); }

.user-tag {
  font-size: 10px; padding: 2px 7px; border-radius: 20px;
  background: rgba(45,125,210,0.05); color: var(--text2);
  border: 1px solid rgba(45,125,210,0.18);
  font-family: var(--mono); font-weight: 500;
  cursor: pointer;
}
.user-tag::before { content: '#'; opacity: 0.5; margin-right: 1px; }
.user-tag:hover { background: var(--accent-glow); color: var(--accent); }

.card-note {
  font-size: 12px; color: var(--text2); margin-top: 8px;
  padding-top: 8px; border-top: 1px solid var(--border);
  line-height: 1.5;
}

.related-section { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.related-label { font-size: 10px; color: var(--accent); font-family: var(--mono); letter-spacing: .05em; margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.related-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px; border-radius: 8px;
  background: var(--surface2); margin-bottom: 4px;
  font-size: 11px; color: var(--text2); cursor: pointer;
  border: 1px solid var(--border);
}
.related-item:hover { background: var(--surface3); }
.related-item-icon { font-size: 13px; }

.reasons { display: inline-flex; gap: 3px; align-items: center; flex-wrap: wrap; }
.reason-chip {
  font-size: 9px; padding: 1px 6px; border-radius: 10px;
  background: var(--surface3); color: var(--text2);
  font-family: var(--mono); line-height: 1.5;
}
.reason-chip[data-k="link"] { background: var(--accent-glow); color: var(--accent); }
.reason-chip[data-k="venue"] { background: var(--green-bg); color: var(--green); }
.reason-chip[data-k="company"] { background: var(--blue-bg); color: var(--blue); }
.reason-chip[data-k="topic"] { background: var(--amber-bg); color: var(--amber); }
.reason-chip[data-k="tag"] { background: var(--pink-bg); color: var(--pink); }
.reason-chip[data-k="category"] { background: var(--surface3); color: var(--text2); }

/* Search highlight */
mark { background: var(--amber-bg); color: var(--amber); padding: 0 1px; border-radius: 2px; font-weight: 600; }

/* Follow-up badge */
.followup-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; padding: 2px 7px; border-radius: 12px;
  background: var(--amber-bg); color: var(--amber);
  font-family: var(--mono);
}
.followup-overdue { background: var(--red-bg); color: var(--red); }

/* ── Search ── */
.search-wrap { position: relative; margin-bottom: 14px; }
.search-input {
  width: 100%; padding: 10px 14px 10px 38px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text); font-family: var(--font);
  font-size: 14px; outline: none; transition: border-color .2s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text3); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }

/* ── Filter / Sort bar ── */
.filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
  padding: 5px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap;
  border: 1px solid var(--border); background: transparent; color: var(--text2);
  cursor: pointer; transition: all .15s; font-family: var(--font);
}
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.sort-bar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  font-size: 11px; color: var(--text3); font-family: var(--mono);
}
.sort-bar select {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 22px 4px 8px; color: var(--text);
  font-family: var(--mono); font-size: 11px; outline: none;
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b6860' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 6px center;
}

/* ── Section label ── */
.section-label {
  font-size: 10px; color: var(--text3); font-family: var(--mono);
  letter-spacing: .08em; text-transform: uppercase;
  margin-bottom: 10px; margin-top: 4px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-label .link {
  font-size: 10px; color: var(--accent); cursor: pointer;
  text-transform: none; letter-spacing: 0;
}

/* ── FAB ── */
.fab {
  position: fixed; bottom: 80px; right: 16px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(45,125,210,0.35);
  z-index: 40; transition: transform .15s, box-shadow .15s;
}
.fab:active { transform: scale(0.94); box-shadow: 0 2px 8px rgba(45,125,210,0.25); }
.fab svg { width: 24px; height: 24px; stroke: #fff; stroke-width: 2.2; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 100; display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-height: 92dvh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  padding-bottom: env(safe-area-inset-bottom, 16px);
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 10px auto 4px; }
.modal-header { padding: 8px 16px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 600; }
.modal-body { padding: 16px; }
.modal-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 22px; line-height: 1; padding: 4px; }

/* ── Form ── */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; display: block; font-family: var(--mono); }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 12px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: var(--font); font-size: 14px; outline: none;
  transition: border-color .2s; appearance: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-select option { background: var(--surface2); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Tag input */
.tag-input-wrap {
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  padding: 8px 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); min-height: 42px;
  cursor: text;
}
.tag-input-wrap:focus-within { border-color: var(--accent); }
.tag-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--accent-glow); color: var(--accent);
  padding: 2px 4px 2px 8px; border-radius: 12px; font-size: 11px;
  font-family: var(--mono);
}
.tag-chip-x { cursor: pointer; opacity: 0.6; font-size: 14px; line-height: 1; padding: 0 4px; }
.tag-chip-x:hover { opacity: 1; }
.tag-input {
  flex: 1; min-width: 80px; border: none; outline: none;
  background: transparent; font-size: 13px; font-family: var(--font);
  color: var(--text); padding: 4px 2px;
}
.tag-suggest-row { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag-suggest {
  font-size: 10px; padding: 2px 7px; border-radius: 12px;
  background: var(--surface3); color: var(--text2); cursor: pointer;
  border: 1px solid var(--border); font-family: var(--mono);
}
.tag-suggest:hover { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }
.tag-suggest::before { content: '#'; opacity: 0.5; margin-right: 1px; }

/* ── Importance stars ── */
.star-row { display: flex; gap: 6px; }
.star-btn { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--text3); transition: color .15s; line-height: 1; }
.star-btn.active { color: var(--amber); }

/* ── Camera / Upload ── */
.upload-zone {
  border: 1.5px dashed var(--border2); border-radius: var(--radius);
  padding: 24px 16px; text-align: center; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.upload-zone:hover { border-color: var(--accent); background: var(--accent-glow); }
.upload-zone-icon { font-size: 32px; margin-bottom: 8px; }
.upload-zone-text { font-size: 13px; color: var(--text2); }
.upload-zone-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
input[type=file] { display: none; }

/* ── OCR result ── */
.ocr-result {
  background: var(--blue-bg); border-radius: var(--radius-sm);
  padding: 12px; margin-top: 12px; font-size: 12px;
  color: var(--text2); line-height: 1.7; font-family: var(--mono);
  border-left: 3px solid var(--accent);
}
.ocr-label { font-size: 10px; color: var(--accent); margin-bottom: 4px; font-family: var(--mono); letter-spacing:.05em; }

/* ── Buttons ── */
.btn-primary {
  width: 100%; padding: 13px; border-radius: var(--radius-sm);
  background: var(--accent); border: none; color: #fff;
  font-size: 15px; font-weight: 500; cursor: pointer;
  font-family: var(--font); transition: opacity .15s, transform .15s;
}
.btn-primary:active { opacity: .85; transform: scale(.98); }
.btn-secondary {
  width: 100%; padding: 11px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid var(--border2); color: var(--text2);
  font-size: 14px; cursor: pointer; font-family: var(--font);
  transition: background .15s; margin-top: 8px;
}
.btn-secondary:hover { background: var(--surface2); }

/* ── Detail modal specifics ── */
.detail-avatar {
  width: 60px; height: 60px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; margin: 0 auto 12px;
  font-family: var(--mono); color: #fff;
}
.detail-name { text-align: center; font-size: 18px; font-weight: 600; }
.detail-role { text-align: center; font-size: 12px; color: var(--text2); margin-top: 2px; }
.detail-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.detail-row:last-child { border-bottom: none; }
.detail-row-icon { font-size: 16px; width: 24px; text-align: center; color: var(--text3); flex-shrink: 0; }
.detail-row-label { font-size: 11px; color: var(--text3); width: 60px; flex-shrink: 0; }
.detail-row-val { font-size: 13px; color: var(--text); flex: 1; word-break: break-word; }

/* Relations in detail */
.rel-card {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 6px; background: var(--surface);
}
.rel-card-main { flex: 1; min-width: 0; cursor: pointer; }
.rel-card-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel-card-sub { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }
.rel-unlink {
  background: none; border: none; color: var(--text3);
  cursor: pointer; padding: 4px 8px; font-size: 14px; line-height: 1;
}
.rel-unlink:hover { color: var(--red); }

/* Picker (for linking) */
.picker-result {
  padding: 8px 10px; border-radius: 6px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; margin-bottom: 4px;
  border: 1px solid transparent;
}
.picker-result:hover { background: var(--surface2); border-color: var(--border); }

/* ── Empty state ── */
.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
.empty-text { font-size: 13px; }

/* ── Stats ── */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.stat-num { font-size: 26px; font-weight: 700; font-family: var(--mono); color: var(--text); }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Stat bars */
.stat-bar-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; padding: 4px 0; cursor: pointer;
}
.stat-bar-row:hover .stat-bar-label { color: var(--accent); }
.stat-bar-label { width: 90px; color: var(--text2); flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 4px; }
.stat-bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.stat-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.stat-bar-num { font-family: var(--mono); color: var(--text3); width: 28px; text-align: right; font-size: 10px; }

/* ── Loading ── */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Type icon map ── */
.type-contact { background: var(--blue-bg) !important; color: var(--blue) !important; }
.type-dm { background: var(--pink-bg) !important; color: var(--pink) !important; }
.type-note { background: var(--green-bg) !important; color: var(--green) !important; }

/* ── Importance indicator ── */
.imp-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
.imp-1 { background: var(--text3); }
.imp-2 { background: var(--amber); }
.imp-3 { background: var(--green); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #1a1a18; border: none;
  color: #fff; padding: 10px 20px; border-radius: 24px;
  font-size: 13px; z-index: 200; opacity: 0;
  transition: opacity .2s, transform .2s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Undo bar */
.undo-bar {
  position: fixed; bottom: 90px; left: 16px; right: 16px;
  background: #1a1a18; color: #fff; border-radius: var(--radius);
  padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  z-index: 150; opacity: 0; transform: translateY(20px);
  transition: opacity .2s, transform .2s; pointer-events: none;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.undo-bar.show { opacity: 1; transform: translateY(0); pointer-events: all; }
.undo-bar-msg { flex: 1; font-size: 13px; }
.undo-bar-btn {
  background: none; border: none; color: #5ba7ff;
  font-size: 13px; font-weight: 600; cursor: pointer;
  padding: 4px 8px; font-family: var(--font);
}
.undo-bar-timer {
  font-family: var(--mono); font-size: 10px;
  color: rgba(255,255,255,0.5); width: 18px; text-align: center;
}

/* ── Storage toggle ── */
.storage-badge {
  font-size: 10px; font-family: var(--mono);
  padding: 3px 8px; border-radius: 12px;
  background: var(--blue-bg); color: var(--blue); cursor: pointer;
  border: 1px solid rgba(45,125,210,0.2);
}
.storage-badge.warn { background: var(--amber-bg); color: var(--amber); border-color: rgba(160,96,16,0.2); }

/* Duplicate warning */
.dup-warn {
  background: var(--amber-bg); border-left: 3px solid var(--amber);
  border-radius: var(--radius-sm); padding: 12px;
  margin-bottom: 12px; font-size: 12px; color: var(--amber);
}
.dup-warn-title { font-weight: 600; margin-bottom: 6px; }
.dup-warn-card {
  background: var(--surface); color: var(--text); padding: 8px;
  border-radius: 6px; margin-top: 8px; cursor: pointer;
  display: flex; gap: 8px; align-items: center;
}

/* ═══════════════════════════════════════════════════════
   v2.1: Compact mode, Pin button, Smart Views, Group Views
   ═══════════════════════════════════════════════════════ */

.card { position: relative; }

/* Pin button (subtle on cards, prominent in detail) */
.pin-btn {
  position: absolute;
  top: 10px; right: 10px;
  background: none; border: none; cursor: pointer;
  color: var(--text3); opacity: 0.3;
  font-size: 14px; padding: 4px 6px; line-height: 1;
  transition: opacity .15s, color .15s, transform .1s;
  z-index: 2; border-radius: 6px;
}
.card:hover .pin-btn { opacity: 0.65; }
.pin-btn:hover { opacity: 1; color: var(--amber); background: var(--surface2); }
.pin-btn:active { transform: scale(.9); }
.pin-btn.pinned { opacity: 1; color: var(--amber); }

/* Compact mode cards */
.card.compact {
  padding: 8px 10px;
  margin-bottom: 4px;
}
.card.compact .card-header { margin-bottom: 0; gap: 8px; align-items: center; }
.card.compact .avatar { width: 32px; height: 32px; font-size: 11px; border-radius: 8px; }
.card.compact .card-name { font-size: 13px; }
.card.compact .card-role { font-size: 10px; }
.card.compact .card-date { font-size: 10px; }
.card.compact .tags,
.card.compact .card-note,
.card.compact .related-section { display: none; }
.card.compact .pin-btn { top: 6px; right: 6px; font-size: 12px; }
.card.compact .card-meta { padding-right: 24px; }

/* Smart view tiles row */
.smart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.smart-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: border-color .15s, transform .1s;
}
.smart-tile:hover { border-color: var(--accent); }
.smart-tile:active { transform: scale(.98); }
.smart-tile-icon { font-size: 18px; flex-shrink: 0; }
.smart-tile-body { flex: 1; min-width: 0; }
.smart-tile-num { font-size: 17px; font-weight: 600; font-family: var(--mono); line-height: 1.1; }
.smart-tile-label { font-size: 10px; color: var(--text2); margin-top: 3px; }
.smart-tile[data-kind="dormant"]   { border-left: 3px solid var(--amber); }
.smart-tile[data-kind="incomplete"]{ border-left: 3px solid var(--red); }
.smart-tile[data-kind="recent"]    { border-left: 3px solid var(--green); }
.smart-tile[data-kind="archived"]  { border-left: 3px solid var(--text3); }
.smart-tile[data-kind="pinned"]    { border-left: 3px solid var(--amber); }
.smart-tile[data-kind="company"]   { border-left: 3px solid var(--blue); }
.smart-tile[data-kind="venue"]     { border-left: 3px solid var(--accent); }

/* View header (for non-tab pages) */
.view-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.back-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer;
  color: var(--text2); padding: 6px 8px;
  display: flex; align-items: center; gap: 4px;
  font-family: var(--font); font-size: 12px; flex-shrink: 0;
}
.back-btn:hover { color: var(--accent); border-color: var(--accent); }
.view-title { font-size: 15px; font-weight: 600; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.view-subtitle { font-size: 11px; color: var(--text3); font-family: var(--mono); }

/* Group summary (for company/venue view) */
.group-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  display: flex; gap: 12px; align-items: center;
}
.group-summary-icon { font-size: 28px; flex-shrink: 0; }
.group-summary-body { flex: 1; min-width: 0; }
.group-summary-name { font-size: 16px; font-weight: 600; word-break: break-word; }
.group-summary-stats { font-size: 11px; color: var(--text2); margin-top: 4px; font-family: var(--mono); }

/* Group list items (for /companies, /venues) */
.group-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color .15s;
}
.group-item:hover { border-color: var(--accent); }
.group-item-icon { font-size: 18px; flex-shrink: 0; }
.group-item-body { flex: 1; min-width: 0; }
.group-item-name {
  font-size: 13px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.group-item-meta { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-top: 2px; }
.group-item-pills { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.type-pill {
  font-size: 9px; padding: 1px 6px; border-radius: 6px;
  font-family: var(--mono);
}
.group-item-count {
  font-family: var(--mono); font-size: 14px; color: var(--text2);
  font-weight: 500; flex-shrink: 0;
}

/* Compact / archive toggles */
.view-toggle {
  background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 9px;
  cursor: pointer; font-family: var(--mono); font-size: 10px;
  color: var(--text2);
  display: inline-flex; align-items: center; gap: 4px;
}
.view-toggle:hover { color: var(--accent); border-color: var(--accent); }
.view-toggle.active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }

/* Show more / load more */
.show-more {
  width: 100%; padding: 10px; margin-top: 4px;
  background: transparent; border: 1px dashed var(--border2);
  border-radius: var(--radius-sm); cursor: pointer;
  color: var(--text2); font-family: var(--font); font-size: 12px;
}
.show-more:hover { background: var(--surface2); color: var(--accent); border-color: var(--accent); }

/* Archive badge on cards */
.archive-badge {
  font-size: 9px; padding: 1px 6px; border-radius: 8px;
  background: var(--surface3); color: var(--text3);
  font-family: var(--mono); margin-left: 4px;
}

/* Clickable company/venue text in cards */
.clickable-meta { cursor: pointer; }
.clickable-meta:hover { color: var(--accent); text-decoration: underline; }

/* ═══════════════════════════════════════════════════════
   v2.2: Lecture notes + AI extraction
   ═══════════════════════════════════════════════════════ */

.type-lecture { background: rgba(160,96,16,0.12) !important; color: var(--amber) !important; }

</style>

<script>
// ══════════════════════════════════════════════════════════════
// CONFIG & MIGRATION
// ══════════════════════════════════════════════════════════════
const DB_KEY = 'knowledgehub_v2';
const LEGACY_KEY = 'knowledgehub_v1';
const CATS_KEY = 'knowledgehub_cats';
const BACKUP_KEY = 'knowledgehub_lastbackup';
const BACKUP_WARN_DAYS = 14;

(function migrate(){
  // v1 -> v2: add tags, linkedIds, updatedAt, followupAt
  if (localStorage.getItem(DB_KEY)) return;
  const v1 = localStorage.getItem(LEGACY_KEY);
  if (!v1) return;
  try {
    const data = JSON.parse(v1) || [];
    const migrated = data.map(r => ({
      ...r,
      tags: Array.isArray(r.tags) ? r.tags : [],
      linkedIds: Array.isArray(r.linkedIds) ? r.linkedIds : [],
      updatedAt: r.updatedAt || r.createdAt,
      followupAt: r.followupAt || null,
    }));
    localStorage.setItem(DB_KEY, JSON.stringify(migrated));
  } catch(e) { console.warn('v1 migration failed', e); }
})();

// ══════════════════════════════════════════════════════════════
// DATA LAYER
// ══════════════════════════════════════════════════════════════
function loadDB() {
  try { return JSON.parse(localStorage.getItem(DB_KEY)) || []; }
  catch { return []; }
}
function saveDB(data) {
  localStorage.setItem(DB_KEY, JSON.stringify(data));
  _indexCache = null;
  updateStats();
}
function getAll() { return loadDB(); }
function getById(id) { return loadDB().find(r => r.id === id); }

function addRecord(rec) {
  const db = loadDB();
  const now = new Date().toISOString();
  const newRec = {
    tags: [], linkedIds: [], followupAt: null,
    ...rec,
    id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
    createdAt: now, updatedAt: now,
  };
  db.unshift(newRec);
  saveDB(db);
  return newRec;
}
function updateRecord(id, updates) {
  const db = loadDB();
  const idx = db.findIndex(r => r.id === id);
  if (idx !== -1) {
    db[idx] = { ...db[idx], ...updates, updatedAt: new Date().toISOString() };
    saveDB(db);
  }
}
function deleteRecord(id) {
  const db = loadDB();
  const removed = db.find(r => r.id === id);
  if (!removed) return null;
  // Clean up linkedIds in other records pointing here
  const filtered = db.filter(r => r.id !== id).map(r => ({
    ...r,
    linkedIds: (r.linkedIds || []).filter(lid => lid !== id),
  }));
  saveDB(filtered);
  return removed;
}

// Bi-directional link management
function linkRecords(idA, idB) {
  if (idA === idB) return;
  const db = loadDB();
  const a = db.find(r => r.id === idA);
  const b = db.find(r => r.id === idB);
  if (!a || !b) return;
  a.linkedIds = [...new Set([...(a.linkedIds || []), idB])];
  b.linkedIds = [...new Set([...(b.linkedIds || []), idA])];
  a.updatedAt = b.updatedAt = new Date().toISOString();
  saveDB(db);
}
function unlinkRecords(idA, idB) {
  const db = loadDB();
  const a = db.find(r => r.id === idA);
  const b = db.find(r => r.id === idB);
  if (a) a.linkedIds = (a.linkedIds || []).filter(x => x !== idB);
  if (b) b.linkedIds = (b.linkedIds || []).filter(x => x !== idA);
  saveDB(db);
}

// ══════════════════════════════════════════════════════════════
// CATEGORIES (same domain knowledge as before)
// ══════════════════════════════════════════════════════════════

  '其他':         { color: 'tag-amber',  icon: '📌', group: '其他' },

function loadCustomCats() {
  try { return JSON.parse(localStorage.getItem(CATS_KEY)) || {}; } catch { return {}; }
}
function saveCustomCats(obj) { localStorage.setItem(CATS_KEY, JSON.stringify(obj)); }
function getCAT_MAP() { return { ...DEFAULT_CATS, ...loadCustomCats() }; }
let CAT_MAP = getCAT_MAP();

const TYPE_MAP = {
  contact: { label: '名片', icon: '👤', cls: 'type-contact' },
  dm:      { label: 'DM',   icon: '📄', cls: 'type-dm' },

const IMP_MAP = { 1: { cls: 'imp-1', label: '備用' }, 2: { cls: 'imp-2', label: '重要' }, 3: { cls: 'imp-3', label: '必用' } };

function catColor(cat) { CAT_MAP = getCAT_MAP(); return (CAT_MAP[cat] || CAT_MAP['其他']).color; }
function catIcon(cat)  { CAT_MAP = getCAT_MAP(); return (CAT_MAP[cat] || CAT_MAP['其他']).icon; }
function initials(name) {
  if (!name) return '?';
  const n = name.trim();
  if (/[\u4e00-\u9fff]/.test(n)) return n.slice(-2);
  return n.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}
function avatarBg(str) {
  const palette = ['#3b3a8f','#1a5c7a','#2d6a4f','#6b3a2a','#4a1a6b','#1a4a6b'];
  let h = 0; for (const c of str || 'X') h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
  return palette[Math.abs(h) % palette.length];
}

// ══════════════════════════════════════════════════════════════
// TOKENIZER + INVERTED INDEX (TF-IDF scoring)
//   - For CJK: extract bigrams + trigrams (no word boundaries)
//   - For Latin: split on non-word boundaries, lowercase
//   - IDF down-weights common tokens automatically
// ══════════════════════════════════════════════════════════════
function tokenize(text) {
  if (!text) return [];
  const t = String(text).toLowerCase();
  const tokens = new Set();
  // Latin / digit words (>=2 chars)
  (t.match(/[a-z0-9]{2,}/g) || []).forEach(w => tokens.add(w));
  // CJK segments
  const cjkSegs = t.replace(/[^\u4e00-\u9fff]/g, ' ').split(/\s+/).filter(Boolean);
  cjkSegs.forEach(seg => {
    if (seg.length === 1) tokens.add(seg);
    for (let i = 0; i < seg.length - 1; i++) tokens.add(seg.substr(i, 2));
    for (let i = 0; i < seg.length - 2; i++) tokens.add(seg.substr(i, 3));
  });
  return [...tokens];
}

function recordText(r) {
  return [
    r.name, r.company, r.title, r.keywords, r.content,
    r.note, r.venue, r.category, r.speaker,
    r.transcript, r.summary,
    (r.keypoints || []).join(' '),
    (r.actionItems || []).join(' '),
    (r.tags || []).join(' '),
  ].filter(Boolean).join(' ');
}

let _indexCache = null;
function getIndex() {
  if (_indexCache) return _indexCache;
  const all = getAll();
  const N = Math.max(all.length, 1);
  const docTokens = new Map(); // id -> Set
  const df = new Map();        // token -> doc count
  all.forEach(r => {
    const set = new Set(tokenize(recordText(r)));
    docTokens.set(r.id, set);
    set.forEach(tok => df.set(tok, (df.get(tok) || 0) + 1));
  });
  const idf = new Map();
  df.forEach((count, tok) => {
    // smoothed IDF; common terms ~0, rare terms higher
    idf.set(tok, Math.log((N + 1) / (count + 1)) + 0.1);
  });
  _indexCache = { docTokens, idf, N, all };
  return _indexCache;
}

// Scored search: returns records sorted by TF-IDF score, with matched tokens for highlighting
function searchScored(query) {
  const q = (query || '').trim();
  if (!q) return [];
  const qTokens = tokenize(q);
  if (qTokens.length === 0) return [];
  const idx = getIndex();
  const scores = new Map();
  const matchedByDoc = new Map();
  qTokens.forEach(tok => {
    const w = idx.idf.get(tok);
    if (!w) return;
    idx.docTokens.forEach((tokens, id) => {
      if (tokens.has(tok)) {
        scores.set(id, (scores.get(id) || 0) + w);
        if (!matchedByDoc.has(id)) matchedByDoc.set(id, new Set());
        matchedByDoc.get(id).add(tok);
      }
    });
  });
  const byId = new Map(idx.all.map(r => [r.id, r]));
  return Array.from(scores.entries())
    .map(([id, score]) => ({ ...byId.get(id), _score: score, _matched: matchedByDoc.get(id) }))
    .sort((a, b) => b._score - a._score);
}

// Multi-factor related records
// Score combines: explicit link, shared tags, same venue/company/category,
// and TF-IDF text similarity (which naturally handles Chinese without word boundaries)
function findRelated(record) {
  const idx = getIndex();
  const ownTokens = idx.docTokens.get(record.id) || new Set();
  const ownTags = new Set(record.tags || []);
  const linked = new Set(record.linkedIds || []);
  const out = [];
  idx.all.forEach(r => {
    if (r.id === record.id) return;
    let score = 0;
    const reasons = [];
    if (linked.has(r.id) || (r.linkedIds || []).includes(record.id)) {
      score += 20;
      reasons.push({ k: 'link', t: '已連結' });
    }
    if (record.venue && r.venue && record.venue === r.venue) {
      score += 5;
      reasons.push({ k: 'venue', t: '同場合' });
    }
    if (record.company && r.company && record.company === r.company) {
      score += 4;
      reasons.push({ k: 'company', t: '同公司' });
    }
    const sharedTags = (r.tags || []).filter(t => ownTags.has(t));
    if (sharedTags.length > 0) {
      score += sharedTags.length * 2.5;
      reasons.push({ k: 'tag', t: sharedTags.length === 1 ? `#${sharedTags[0]}` : `${sharedTags.length} 個共同標籤` });
    }
    if (record.category && r.category && record.category === r.category) {
      score += 1.5;
      reasons.push({ k: 'category', t: '同類' });
    }
    // TF-IDF text similarity
    const otherTokens = idx.docTokens.get(r.id) || new Set();
    let textScore = 0;
    let overlap = 0;
    ownTokens.forEach(t => {
      if (otherTokens.has(t)) {
        textScore += idx.idf.get(t) || 0;
        overlap++;
      }
    });
    // Threshold: avoid noise from very common single-char overlaps
    if (textScore >= 1.5) {
      score += textScore;
      reasons.push({ k: 'topic', t: `主題相關 ${overlap}` });
    }
    if (score <= 0) return;
    // Importance soft multiplier (related to higher-importance records gets a bump)
    score *= 1 + ((r.importance || 1) - 1) * 0.15;
    out.push({ ...r, _score: score, _reasons: reasons });
  });
  return out.sort((a, b) => b._score - a._score);
}

// ══════════════════════════════════════════════════════════════
// TAGS (free-form, auto-collected)
// ══════════════════════════════════════════════════════════════
function getAllTags() {
  const counts = new Map();
  getAll().forEach(r => (r.tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
  return [...counts.entries()].sort((a, b) => b[1] - a[1]);
}

function suggestTags(currentList, currentInput) {
  const all = getAllTags();
  const cur = new Set(currentList);
  const input = (currentInput || '').toLowerCase();
  return all
    .filter(([t]) => !cur.has(t))
    .filter(([t]) => !input || t.toLowerCase().includes(input))
    .slice(0, 8)
    .map(([t]) => t);
}

// ══════════════════════════════════════════════════════════════
// DUPLICATE DETECTION
// ══════════════════════════════════════════════════════════════
function normalizePhone(p) { return (p || '').replace(/\D+/g, ''); }
function normalizeEmail(e) { return (e || '').trim().toLowerCase(); }
function findDuplicates(candidate, excludeId) {
  const all = getAll().filter(r => r.id !== excludeId);
  const phone = normalizePhone(candidate.phone);
  const email = normalizeEmail(candidate.email);
  const nameLc = (candidate.name || '').trim().toLowerCase();
  const companyLc = (candidate.company || '').trim().toLowerCase();
  const hits = [];
  all.forEach(r => {
    if (phone && phone.length >= 8 && normalizePhone(r.phone) === phone) {
      hits.push({ r, why: '電話相同' }); return;
    }
    if (email && normalizeEmail(r.email) === email) {
      hits.push({ r, why: 'Email 相同' }); return;
    }
    if (nameLc && (r.name || '').trim().toLowerCase() === nameLc) {
      if (companyLc && (r.company || '').trim().toLowerCase() === companyLc) {
        hits.push({ r, why: '同名同公司' }); return;
      }
      if (!companyLc && !(r.company || '').trim()) {
        hits.push({ r, why: '同名' });
      }
    }
  });
  return hits;
}

// ══════════════════════════════════════════════════════════════
// FOLLOW-UPS
// ══════════════════════════════════════════════════════════════
function followupStatus(iso) {
  if (!iso) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(iso); d.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { kind: 'overdue', days: -diff, label: `逾期 ${-diff}天` };
  if (diff === 0) return { kind: 'today', days: 0, label: '今日跟進' };
  if (diff <= 7) return { kind: 'soon', days: diff, label: `${diff}天後` };
  return { kind: 'future', days: diff, label: formatDate(iso) };
}
function getFollowupsDue() {
  return getAll()
    .filter(r => r.followupAt)
    .map(r => ({ r, st: followupStatus(r.followupAt) }))
    .filter(x => x.st && (x.st.kind === 'overdue' || x.st.kind === 'today' || x.st.kind === 'soon'))
    .sort((a, b) => a.st.days - b.st.days);
}

// ══════════════════════════════════════════════════════════════
// SMART VIEW CRITERIA (Layer 1)
// ══════════════════════════════════════════════════════════════
const DAY = 86400000;

// Auto-archive: importance == 1 AND > 365 days since updatedAt; pinned records never archived
function isArchived(r) {
  if (r.pinned) return false;
  if ((r.importance || 1) > 1) return false;
  if (!r.updatedAt) return false;
  return (Date.now() - new Date(r.updatedAt).getTime()) > 365 * DAY;
}

// Dormant important contact: importance >= 2 AND contact AND > 90 days since updatedAt
function isDormantImportant(r) {
  if (r.type !== 'contact') return false;
  if ((r.importance || 1) < 2) return false;
  if (isArchived(r)) return false;
  if (!r.updatedAt) return false;
  return (Date.now() - new Date(r.updatedAt).getTime()) > 90 * DAY;
}

// Recently added (within 30 days)
function isRecentlyAdded(r) {
  if (!r.createdAt) return false;
  if (isArchived(r)) return false;
  return (Date.now() - new Date(r.createdAt).getTime()) <= 30 * DAY;
}

// Incomplete contact: missing company or any contact method
function isIncomplete(r) {
  if (r.type !== 'contact') return false;
  if (isArchived(r)) return false;
  const hasCompany = !!(r.company && r.company.trim());
  const hasContact = !!((r.phone && r.phone.trim()) || (r.email && r.email.trim()) || (r.line && r.line.trim()));
  return !hasCompany || !hasContact;
}

function togglePin(id) {
  const r = getById(id);
  if (!r) return false;
  updateRecord(id, { pinned: !r.pinned });
  return !r.pinned; // new state
}

// Aggregate by company / venue, excluding archived
function aggregateBy(field) {
  const map = new Map();
  getAll().forEach(r => {
    if (isArchived(r)) return;
    const k = (r[field] || '').trim();
    if (!k) return;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  return map; // Map<string, Record[]>
}

// NAVIGATION (view-based routing)
// ══════════════════════════════════════════════════════════════
let currentView = { type: 'browse' };
let currentFilter = 'all';
let currentSort = 'recent'; // recent | important | name
let currentImpFilter = 0;   // 0 = any, 2 = >=2, 3 = =3
let editingId = null;
let compactMode = localStorage.getItem('knowledgehub_compact') === '1';
let renderLimit = 100;       // pagination cap per list
let renderLimitOverride = null; // when user clicks "show more"

const PRIMARY_NAVS = {
  browse:   () => ({ type: 'browse' }),
  contacts: () => ({ type: 'list', recType: 'contact' }),
  dm:       () => ({ type: 'list', recType: 'dm' }),
  notes:    () => ({ type: 'list', recType: 'note' }),
  search:   () => ({ type: 'search' }),
};

function showView(view) {
  currentView = view;
  currentFilter = 'all';
  renderLimitOverride = null;
  // Bottom nav active state
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  let navId = null;
  if (view.type === 'browse') navId = 'nav-browse';
  else if (view.type === 'search') navId = 'nav-search';
  else if (view.type === 'list') {
    if (view.recType === 'contact') navId = 'nav-contacts';
    else if (view.recType === 'dm') navId = 'nav-dm';
    else if (view.recType === 'note') navId = 'nav-notes';
  }
  if (navId) document.getElementById(navId).classList.add('active');
  // FAB visibility
  const fab = document.getElementById('fab');
  fab.style.display = (view.type === 'search') ? 'none' : 'flex';
  // Scroll main back to top
  const main = document.getElementById('mainContent');
  if (main) main.scrollTop = 0;
  render();
}

// Backward-compat for bottom nav onclicks
function showPage(name) {
  const factory = PRIMARY_NAVS[name];
  if (factory) showView(factory());
}

function openCompany(name) { showView({ type: 'group', kind: 'company', value: name }); }
function openVenue(name) { showView({ type: 'group', kind: 'venue', value: name }); }
function openSmart(filter) { showView({ type: 'smart', filter }); }
function openCompanyList() { closeModal('menuModal'); showView({ type: 'group-list', kind: 'company' }); }
function openVenueList() { closeModal('menuModal'); showView({ type: 'group-list', kind: 'venue' }); }
function goBack() { showView({ type: 'browse' }); }

function toggleCompact() {
  compactMode = !compactMode;
  localStorage.setItem('knowledgehub_compact', compactMode ? '1' : '0');
  render();
}

function loadMore() {
  renderLimitOverride = (renderLimitOverride || renderLimit) + renderLimit;
  render();
}

function updateStats() {
  const all = getAll();
  document.getElementById('topStats').textContent = all.length + ' 筆';
  // Backup warning
  const badge = document.getElementById('storageBadge');
  const lastBackup = localStorage.getItem(BACKUP_KEY);
  if (all.length >= 5) {
    if (!lastBackup) {
      badge.textContent = '建議備份';
      badge.classList.add('warn');
    } else {
      const days = Math.floor((Date.now() - parseInt(lastBackup)) / 86400000);
      if (days > BACKUP_WARN_DAYS) {
        badge.textContent = `已 ${days}天未備份`;
        badge.classList.add('warn');
      } else {
        badge.textContent = '本機模式';
        badge.classList.remove('warn');
      }
    }
  } else {
    badge.textContent = '本機模式';
    badge.classList.remove('warn');
  }
}

// RENDER ROUTER
// ══════════════════════════════════════════════════════════════
function render() {
  const mc = document.getElementById('mainContent');
  const v = currentView;
  if (v.type === 'browse') mc.innerHTML = renderBrowse();
  else if (v.type === 'list') mc.innerHTML = renderList(v.recType);
  else if (v.type === 'search') mc.innerHTML = renderSearch();
  else if (v.type === 'group') mc.innerHTML = renderGroupView(v.kind, v.value);
  else if (v.type === 'group-list') mc.innerHTML = renderGroupList(v.kind);
  else if (v.type === 'smart') mc.innerHTML = renderSmartView(v.filter);
}

function renderBrowse() {
  const allRecs = getAll();
  const live = allRecs.filter(r => !isArchived(r));
  const contacts = live.filter(r => r.type === 'contact').length;
  const dms = live.filter(r => r.type === 'dm').length;
  const notes = live.filter(r => r.type === 'note' || r.type === 'lecture').length;
  const highImp = live.filter(r => r.importance === 3).length;

  let html = `
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num">${contacts}</div><div class="stat-label">人脈名片</div></div>
    <div class="stat-card"><div class="stat-num">${dms}</div><div class="stat-label">展場 DM</div></div>
    <div class="stat-card"><div class="stat-num">${notes}</div><div class="stat-label">知識筆記</div></div>
    <div class="stat-card"><div class="stat-num">${highImp}</div><div class="stat-label">高重要度</div></div>
  </div>`;

  if (allRecs.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🗂️</div><div class="empty-text">還沒有任何資料<br>點右下角 + 開始新增</div></div>`;
    return html;
  }

  // 📌 釘選 section
  const pinned = live.filter(r => r.pinned).sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
  if (pinned.length > 0) {
    html += `<div class="section-label" style="color:var(--amber)">📌 釘選 (${pinned.length})
      <span class="link" onclick="openSmart('pinned')">全部 →</span></div>`;
    html += pinned.slice(0, 5).map(r => renderCard(r, { compact: true })).join('');
  }

  // ⏰ Follow-ups due
  const fus = getFollowupsDue();
  if (fus.length > 0) {
    html += `<div class="section-label" style="color:var(--amber)">⏰ 待跟進 (${fus.length})</div>`;
    html += fus.slice(0, 5).map(({ r, st }) => `
      <div class="card compact" onclick="openDetail('${r.id}')" style="border-left:3px solid var(--${st.kind === 'overdue' ? 'red' : 'amber'})">
        <div class="card-header">
          <div class="avatar" style="background:${avatarBg(r.name||r.id)}">${initials(r.name || r.type)}</div>
          <div class="card-meta">
            <div class="card-name">${esc(r.name) || '（未命名）'}</div>
            <div class="card-role">${esc([r.company, r.title].filter(Boolean).join(' · ')) || ''}</div>
            <div class="card-date">
              <span class="followup-badge ${st.kind === 'overdue' ? 'followup-overdue' : ''}">⏰ ${st.label}</span>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  // ✨ Smart Views row
  const counts = {
    recent: live.filter(isRecentlyAdded).length,
    dormant: live.filter(isDormantImportant).length,
    incomplete: live.filter(isIncomplete).length,
    archived: allRecs.filter(isArchived).length,
  };
  const smartTiles = [];
  smartTiles.push(`<div class="smart-tile" data-kind="recent" onclick="openSmart('recent')">
    <div class="smart-tile-icon">✨</div>
    <div class="smart-tile-body">
      <div class="smart-tile-num">${counts.recent}</div>
      <div class="smart-tile-label">近 30 天新加入</div>
    </div></div>`);
  if (counts.dormant > 0) {
    smartTiles.push(`<div class="smart-tile" data-kind="dormant" onclick="openSmart('dormant')">
      <div class="smart-tile-icon">💤</div>
      <div class="smart-tile-body">
        <div class="smart-tile-num">${counts.dormant}</div>
        <div class="smart-tile-label">久未聯絡重要人脈</div>
      </div></div>`);
  }
  if (counts.incomplete > 0) {
    smartTiles.push(`<div class="smart-tile" data-kind="incomplete" onclick="openSmart('incomplete')">
      <div class="smart-tile-icon">⚠️</div>
      <div class="smart-tile-body">
        <div class="smart-tile-num">${counts.incomplete}</div>
        <div class="smart-tile-label">缺資料的名片</div>
      </div></div>`);
  }
  // Always show company/venue overview tiles
  const companies = aggregateBy('company');
  const venues = aggregateBy('venue');
  smartTiles.push(`<div class="smart-tile" data-kind="company" onclick="openCompanyList()">
    <div class="smart-tile-icon">🏢</div>
    <div class="smart-tile-body">
      <div class="smart-tile-num">${companies.size}</div>
      <div class="smart-tile-label">公司一覽</div>
    </div></div>`);
  smartTiles.push(`<div class="smart-tile" data-kind="venue" onclick="openVenueList()">
    <div class="smart-tile-icon">📍</div>
    <div class="smart-tile-body">
      <div class="smart-tile-num">${venues.size}</div>
      <div class="smart-tile-label">場合一覽</div>
    </div></div>`);
  if (counts.archived > 0) {
    smartTiles.push(`<div class="smart-tile" data-kind="archived" onclick="openSmart('archived')">
      <div class="smart-tile-icon">📦</div>
      <div class="smart-tile-body">
        <div class="smart-tile-num">${counts.archived}</div>

      </div></div>`);

  html += `<div class="section-label">✨ 智慧視圖</div>`;

  if (tags.length > 0) {
    html += `<div class="section-label">熱門標籤</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">${
      tags.slice(0, 12).map(([t, c]) =>
        `<span class="user-tag" onclick="searchByTag('${esc(t)}')">${esc(t)} <span style="opacity:.5">${c}</span></span>`
      ).join('')
    }</div>`;
  }

  // Category distribution
  const catCounts = {};
  live.forEach(r => { catCounts[r.category || '其他'] = (catCounts[r.category || '其他'] || 0) + 1; });
  const topCats = Object.entries(catCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxCat = topCats[0]?.[1] || 1;
  if (topCats.length > 0) {
    html += `<div class="section-label">資料分布 <span style="text-transform:none;letter-spacing:0;color:var(--text3)">前 ${topCats.length} 大分類</span></div>`;
    html += `<div class="card" style="padding:10px 14px">${
      topCats.map(([c, n]) => `
        <div class="stat-bar-row" onclick="filterByCategory('${esc(c)}')">
          <div class="stat-bar-label">${catIcon(c)} ${esc(c)}</div>
          <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${(n/maxCat*100).toFixed(0)}%"></div></div>
          <div class="stat-bar-num">${n}</div>
        </div>`).join('')
    }</div>`;
  }

  // Recent additions (capped, excludes archived)
  const recent = live.slice(0, 20);
  html += `<div class="section-label">最近新增 <span style="text-transform:none;letter-spacing:0">${renderCompactToggleInline()}</span></div>`;
  html += recent.map(r => renderCard(r, { compact: compactMode })).join('');
  return html;
}

  return `<button class="view-toggle ${compactMode ? 'active' : ''}" onclick="toggleCompact()" title="切換顯示模式">
    ${compactMode ? '☰ 緊湊' : '▤ 卡片'}

}

function filterByCategory(cat) {
  // Determine which page to jump to: find a type that has this category most
  const all = getAll().filter(r => r.category === cat);
  if (all.length === 0) return;
  const typeCounts = {};
  all.forEach(r => { typeCounts[r.type] = (typeCounts[r.type] || 0) + 1; });
  const topType = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1])[0][0];
  const page = topType === 'contact' ? 'contacts' : topType === 'dm' ? 'dm' : 'notes';
  showPage(page);
  setTimeout(() => { setFilter(cat); }, 0);
}

function searchByTag(tag) {
  showPage('search');
  setTimeout(() => {
    const inp = document.getElementById('searchInput');
    if (inp) { inp.value = '#' + tag; doSearch(inp.value); }
  }, 50);
}

function renderList(type) {
  // Knowledge tab unifies notes and lectures
  const matchType = (type === 'note')
    ? (r => r.type === 'note' || r.type === 'lecture')
    : (r => r.type === type);
  let filtered = getAll().filter(r => matchType(r) && !isArchived(r));
  if (filtered.length === 0) {
    const emptyLabel = type === 'note' ? '知識 / 上課' : TYPE_MAP[type].label;
    const emptyIcon = type === 'note' ? '📝' : TYPE_MAP[type].icon;
    return `<div class="empty"><div class="empty-icon">${emptyIcon}</div><div class="empty-text">還沒有${emptyLabel}資料<br>點右下角 + 新增</div></div>`;
  }
  const cats = [...new Set(filtered.map(r => r.category))].filter(Boolean);
  // Filter row
  let html = `<div class="filter-row">
    <button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">全部 (${filtered.length})</button>
    ${cats.map(c=>{
      const n = filtered.filter(r => r.category === c).length;
      return `<button class="filter-btn ${currentFilter===c?'active':''}" onclick="setFilter('${esc(c)}')">${esc(c)} ${n}</button>`;
    }).join('')}
  </div>`;
  // Sort/imp bar (with compact toggle)
  html += `<div class="sort-bar">
    <span>排序</span>
    <select onchange="setSort(this.value)">
      <option value="recent" ${currentSort==='recent'?'selected':''}>最新</option>
      <option value="important" ${currentSort==='important'?'selected':''}>最重要</option>
      <option value="name" ${currentSort==='name'?'selected':''}>名稱</option>
    </select>
    <span>重要度</span>
    <select onchange="setImpFilter(parseInt(this.value))">
      <option value="0" ${currentImpFilter===0?'selected':''}>全部</option>
      <option value="2" ${currentImpFilter===2?'selected':''}>≥ 重要</option>
      <option value="3" ${currentImpFilter===3?'selected':''}>僅必用</option>
    </select>
    <span style="flex:1"></span>
    ${renderCompactToggleInline()}
  </div>`;
  // Apply filters
  let show = currentFilter === 'all' ? filtered : filtered.filter(r => r.category === currentFilter);
  if (currentImpFilter > 0) show = show.filter(r => (r.importance || 1) >= currentImpFilter);
  // Apply sort
  show = sortRecords(show, currentSort);
  if (show.length === 0) {
    html += `<div class="empty"><div class="empty-icon">∅</div><div class="empty-text">沒有符合條件的資料</div></div>`;
  } else {
    const limit = renderLimitOverride || renderLimit;
    const visible = show.slice(0, limit);
    html += visible.map(r => renderCard(r, { compact: compactMode })).join('');
    if (show.length > limit) {
      html += `<button class="show-more" onclick="loadMore()">顯示更多（還有 ${show.length - limit} 筆）</button>`;
    }
  }
  return html;
}

function sortRecords(arr, mode) {
  const a = [...arr];
  if (mode === 'important') {
    return a.sort((x, y) => (y.importance || 1) - (x.importance || 1)
      || (new Date(y.createdAt) - new Date(x.createdAt)));
  }
  if (mode === 'name') {
    return a.sort((x, y) => (x.name || '').localeCompare(y.name || '', 'zh-Hant'));
  }
  return a.sort((x, y) => new Date(y.createdAt) - new Date(x.createdAt));
}

function setFilter(f) { currentFilter = f; render(); }
function setSort(s) { currentSort = s; render(); }
function setImpFilter(n) { currentImpFilter = n; render(); }

function renderSearch() {
  return `
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" placeholder="搜尋名字、公司、關鍵字、#標籤…" oninput="doSearch(this.value)" autofocus>
  </div>
  <div style="margin-bottom:14px;font-size:11px;color:var(--text3);font-family:var(--mono)">
    💡 提示：用 #標籤 直接搜尋標籤；多個關鍵字以空格分隔（OR 搜尋）
  </div>
  <div id="searchResults"><div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">輸入關鍵字搜尋</div></div></div>`;
}

function doSearch(q) {
  const res = document.getElementById('searchResults');
  if (!q.trim()) { res.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">輸入關鍵字搜尋</div></div>`; return; }
  // Handle #tag search separately
  if (q.trim().startsWith('#')) {
    const tag = q.trim().slice(1).toLowerCase();
    const matches = getAll().filter(r => (r.tags || []).some(t => t.toLowerCase().includes(tag)));
    if (matches.length === 0) {
      res.innerHTML = `<div class="empty"><div class="empty-icon">😶</div><div class="empty-text">沒有 #${esc(tag)} 標籤的資料</div></div>`;
      return;
    }
    res.innerHTML = `<div class="section-label">標籤 #${esc(tag)} · ${matches.length} 筆</div>` + matches.map(r => renderCard(r)).join('');
    return;
  }
  const matches = searchScored(q);
  if (matches.length === 0) {
    res.innerHTML = `<div class="empty"><div class="empty-icon">😶</div><div class="empty-text">找不到「${esc(q)}」相關資料</div></div>`;
    return;
  }
  res.innerHTML = `<div class="section-label">找到 ${matches.length} 筆結果 <span style="text-transform:none;letter-spacing:0;color:var(--text3)">依相關度排序</span></div>` +
    matches.map(r => renderCard(r, { matched: r._matched })).join('');
}

// ══════════════════════════════════════════════════════════════
// CARD RENDERING
// ══════════════════════════════════════════════════════════════
function highlight(text, matched) {
  if (!text) return '';
  if (!matched || matched.size === 0) return esc(text);
  // Sort tokens by length desc to avoid sub-matching shorter ones
  const tokens = [...matched].sort((a, b) => b.length - a.length);
  let safe = esc(text);
  tokens.forEach(tok => {
    if (!tok || tok.length < 1) return;
    const re = new RegExp(tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    safe = safe.replace(re, m => `<mark>${m}</mark>`);
  });
  return safe;
}

function renderCard(r, opts) {
  opts = opts || {};
  const compact = !!opts.compact;
  const imp = IMP_MAP[r.importance || 1];
  const typeInfo = TYPE_MAP[r.type] || TYPE_MAP.note;
  const bg = avatarBg(r.name || r.id);
  const fu = followupStatus(r.followupAt);
  const archived = isArchived(r);

  let subtitle = '';
  if (r.type === 'contact') subtitle = [r.company, r.title].filter(Boolean).join(' · ');
  else if (r.type === 'dm') subtitle = r.company || '';
  else if (r.type === 'lecture') {
    subtitle = r.speaker || (r.keypoints && r.keypoints[0]) || (r.summary ? r.summary.slice(0, 40) : '') || '';
  }
  else subtitle = r.keywords || '';

  const matched = opts.matched;
  const userTags = (r.tags || []).slice(0, 4);

  // NOTE: findRelated() is intentionally NOT called here.
  // It was O(n²) — for 1000 records, that's 1M operations per render.
  // Related resources are now shown only in detail view (lazy).

  return `<div class="card${compact ? ' compact' : ''}${archived ? '' : ''}" onclick="openDetail('${r.id}')">
    <button class="pin-btn ${r.pinned ? 'pinned' : ''}"
            onclick="event.stopPropagation();togglePinCard('${r.id}')"
            title="${r.pinned ? '取消釘選' : '釘選'}">${r.pinned ? '★' : '☆'}</button>
    <div class="card-header">
      <div class="avatar ${typeInfo.cls}" style="background:${bg}">${initials(r.name || r.type)}</div>
      <div class="card-meta">
        <div class="card-name">${highlight(r.name || '（未命名）', matched)}${archived ? '<span class="archive-badge">📦 歸檔</span>' : ''}</div>
        ${subtitle ? `<div class="card-role">${highlight(subtitle, matched)}</div>` : ''}
        <div class="card-date">
          <span><span class="imp-dot ${imp.cls}"></span>${imp.label}</span>
          ${r.venue ? `<span>· ${highlight(r.venue, matched)}</span>` : ''}
          <span>· ${formatDate(r.createdAt)}</span>
          ${fu && (fu.kind === 'overdue' || fu.kind === 'today' || fu.kind === 'soon')
            ? `<span class="followup-badge ${fu.kind === 'overdue' ? 'followup-overdue' : ''}">⏰ ${fu.label}</span>` : ''}
        </div>
      </div>
    </div>
    ${compact ? '' : `
    <div class="tags">
      <span class="tag ${catColor(r.category)}">${catIcon(r.category)} ${esc(r.category || '其他')}</span>
      <span class="tag" style="background:var(--surface2);color:var(--text3)">${typeInfo.label}</span>
      ${userTags.map(t => `<span class="user-tag" onclick="event.stopPropagation();searchByTag('${esc(t)}')">${esc(t)}</span>`).join('')}
      ${(r.tags || []).length > 4 ? `<span class="user-tag" style="opacity:.6">+${(r.tags || []).length - 4}</span>` : ''}
    </div>
    ${r.note ? `<div class="card-note">${highlight(r.note.slice(0, 100) + (r.note.length > 100 ? '…' : ''), matched)}</div>` : ''}
    `}
  </div>`;
}

function togglePinCard(id) {
  const newState = togglePin(id);
  showToast(newState ? '✓ 已釘選' : '已取消釘選');
  render();
}

// Simple HTML escape
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ══════════════════════════════════════════════════════════════
// GROUP VIEWS (Company / Venue aggregation)
// ══════════════════════════════════════════════════════════════
function renderGroupView(kind, value) {
  const field = kind === 'company' ? 'company' : 'venue';
  const icon = kind === 'company' ? '🏢' : '📍';
  const label = kind === 'company' ? '公司' : '場合';
  const all = getAll().filter(r => (r[field] || '').trim() === value && !isArchived(r));
  const counts = {
    contact: all.filter(r => r.type === 'contact').length,
    dm: all.filter(r => r.type === 'dm').length,
    note: all.filter(r => r.type === 'note').length,
    lecture: all.filter(r => r.type === 'lecture').length,
  };

  let html = `<div class="view-header">
    <button class="back-btn" onclick="goBack()">← 返回</button>
    <div style="flex:1;min-width:0">
      <div class="view-title">${icon} ${esc(value)}</div>
      <div class="view-subtitle">${label}視圖</div>
    </div>
    ${renderCompactToggleInline()}
  </div>`;

  if (all.length === 0) {
    html += `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-text">這個${label}沒有資料</div></div>`;
    return html;
  }

  html += `<div class="group-summary">
    <div class="group-summary-icon">${icon}</div>
    <div class="group-summary-body">
      <div class="group-summary-name">${esc(value)}</div>
      <div class="group-summary-stats">${all.length} 筆 · ${counts.contact} 名片 · ${counts.dm} DM · ${counts.note} 筆記${counts.lecture ? ` · ${counts.lecture} 上課` : ''}</div>
    </div>
  </div>`;

  // Type filter
  const types = ['all', 'contact', 'dm', 'note', 'lecture'].filter(t => t === 'all' || counts[t] > 0);
  html += `<div class="filter-row">
    ${types.map(t => `<button class="filter-btn ${currentFilter === t ? 'active' : ''}" onclick="setFilter('${t}')">
      ${t === 'all' ? `全部 (${all.length})` : `${TYPE_MAP[t].icon} ${TYPE_MAP[t].label} ${counts[t]}`}
    </button>`).join('')}
  </div>`;

  let show = currentFilter === 'all' ? all : all.filter(r => r.type === currentFilter);
  show = sortRecords(show, currentSort);
  html += show.map(r => renderCard(r, { compact: compactMode })).join('');
  return html;
}

function renderGroupList(kind) {
  const field = kind === 'company' ? 'company' : 'venue';
  const icon = kind === 'company' ? '🏢' : '📍';
  const label = kind === 'company' ? '公司' : '場合';
  const groups = aggregateBy(field);
  if (groups.size === 0) {
    return `<div class="view-header">
      <button class="back-btn" onclick="goBack()">← 返回</button>
      <div class="view-title">${icon} ${label}一覽</div>
    </div>
    <div class="empty"><div class="empty-icon">${icon}</div><div class="empty-text">還沒有資料</div></div>`;
  }
  const entries = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);

  let html = `<div class="view-header">
    <button class="back-btn" onclick="goBack()">← 返回</button>
    <div style="flex:1;min-width:0">
      <div class="view-title">${icon} ${label}一覽</div>
      <div class="view-subtitle">${entries.length} 個${label}</div>
    </div>
  </div>`;

  // Simple search-as-you-type
  html += `<div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="groupSearchInput" placeholder="篩選${label}…" oninput="filterGroupList(this.value)">
  </div>
  <div id="groupListBody">${renderGroupListItems(entries, kind)}</div>`;
  return html;
}

function renderGroupListItems(entries, kind) {
  return entries.map(([name, records]) => {
    const counts = {
      contact: records.filter(r => r.type === 'contact').length,
      dm: records.filter(r => r.type === 'dm').length,
      note: records.filter(r => r.type === 'note').length,
      lecture: records.filter(r => r.type === 'lecture').length,
    };
    const pills = [];
    if (counts.contact) pills.push(`<span class="type-pill type-contact">${TYPE_MAP.contact.icon} ${counts.contact}</span>`);
    if (counts.dm) pills.push(`<span class="type-pill type-dm">${TYPE_MAP.dm.icon} ${counts.dm}</span>`);
    if (counts.note) pills.push(`<span class="type-pill type-note">${TYPE_MAP.note.icon} ${counts.note}</span>`);
    if (counts.lecture) pills.push(`<span class="type-pill type-lecture">${TYPE_MAP.lecture.icon} ${counts.lecture}</span>`);
    const hi = records.filter(r => r.importance === 3).length;
    const meta = hi > 0 ? `${hi} 筆必用 · 最後更新 ${formatDate(records[0].updatedAt || records[0].createdAt)}`
                       : `最後更新 ${formatDate(records[0].updatedAt || records[0].createdAt)}`;
    const handler = kind === 'company' ? `openCompany('${esc(name)}')` : `openVenue('${esc(name)}')`;
    return `<div class="group-item" onclick="${handler}">
      <div class="group-item-icon">${kind === 'company' ? '🏢' : '📍'}</div>
      <div class="group-item-body">
        <div class="group-item-name">${esc(name)}</div>
        <div class="group-item-meta">${meta}</div>
        <div class="group-item-pills">${pills.join('')}</div>
      </div>
      <div class="group-item-count">${records.length}</div>
    </div>`;
  }).join('');
}

function filterGroupList(q) {
  const v = currentView;
  if (!v || v.type !== 'group-list') return;
  const field = v.kind === 'company' ? 'company' : 'venue';
  const groups = aggregateBy(field);
  let entries = [...groups.entries()];
  if (q && q.trim()) {
    const ql = q.toLowerCase();
    entries = entries.filter(([k]) => k.toLowerCase().includes(ql));
  }
  entries.sort((a, b) => b[1].length - a[1].length);
  const body = document.getElementById('groupListBody');
  if (body) body.innerHTML = renderGroupListItems(entries, v.kind);
}

// ══════════════════════════════════════════════════════════════
// SMART VIEWS
// ══════════════════════════════════════════════════════════════
function renderSmartView(filter) {
  const presets = {
    pinned:     { title: '📌 釘選',           subtitle: '手動標記的核心資料',                  predicate: r => r.pinned },
    recent:     { title: '✨ 近 30 天新加入',  subtitle: '最近一個月內新增',                    predicate: isRecentlyAdded },
    dormant:    { title: '💤 久未聯絡的重要人脈', subtitle: '重要度 ≥ 重要、超過 90 天沒更新',  predicate: isDormantImportant },
    incomplete: { title: '⚠️ 缺資料的名片',    subtitle: '聯絡人少了公司或聯絡方式',             predicate: isIncomplete },
    archived:   { title: '📦 歸檔',           subtitle: '備用且超過 12 個月沒更新（搜尋仍找得到）', predicate: isArchived },
  };
  const cfg = presets[filter];
  if (!cfg) return `<div class="empty">未知的視圖</div>`;
  let records = getAll().filter(cfg.predicate);
  records = sortRecords(records, filter === 'dormant' ? 'recent' : currentSort);

  let html = `<div class="view-header">
    <button class="back-btn" onclick="goBack()">← 返回</button>
    <div style="flex:1;min-width:0">
      <div class="view-title">${cfg.title}</div>
      <div class="view-subtitle">${cfg.subtitle}</div>
    </div>
    ${renderCompactToggleInline()}
  </div>`;

  if (records.length === 0) {
    let emptyMsg = '沒有符合的資料';
    if (filter === 'pinned') emptyMsg = '尚未釘選任何資料<br>在卡片右上角點 ☆ 即可釘選';
    else if (filter === 'archived') emptyMsg = '沒有歸檔資料';
    else if (filter === 'dormant') emptyMsg = '所有重要人脈都在 90 天內有更新 ✓';
    else if (filter === 'incomplete') emptyMsg = '所有名片資料都完整 ✓';
    html += `<div class="empty"><div class="empty-icon">${cfg.title.split(' ')[0]}</div><div class="empty-text">${emptyMsg}</div></div>`;
    return html;
  }

  // Summary header
  html += `<div style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:10px">${records.length} 筆</div>`;

  // Pagination
  const limit = renderLimitOverride || renderLimit;
  const visible = records.slice(0, limit);
  html += visible.map(r => renderCard(r, { compact: compactMode })).join('');
  if (records.length > limit) {
    html += `<button class="show-more" onclick="loadMore()">顯示更多（還有 ${records.length - limit} 筆）</button>`;
  }
  return html;
}

function openDetail(id) {
  const r = getById(id);
  if (!r) return;
  const bg = avatarBg(r.name || r.id);
  const typeInfo = TYPE_MAP[r.type] || TYPE_MAP.note;
  const imp = IMP_MAP[r.importance || 1];
  const related = findRelated(r);
  const linkedRecords = (r.linkedIds || []).map(getById).filter(Boolean);

  let fields = '';
  const clickableCompany = c => `<span class="clickable-meta" onclick="closeModal('detailModal');setTimeout(()=>openCompany('${esc(c)}'),200)">${esc(c)}</span>`;
  const clickableVenue = v => `<span class="clickable-meta" onclick="closeModal('detailModal');setTimeout(()=>openVenue('${esc(v)}'),200)">${esc(v)}</span>`;
  if (r.type === 'contact') {
    if (r.company) fields += detailRow('🏢', '公司', clickableCompany(r.company));
    if (r.title) fields += detailRow('💼', '職稱', esc(r.title));
    if (r.phone) fields += detailRow('📞', '電話', `<a href="tel:${esc(r.phone)}" style="color:var(--accent);text-decoration:none">${esc(r.phone)}</a>`);
    if (r.email) fields += detailRow('✉️', 'Email', `<a href="mailto:${esc(r.email)}" style="color:var(--accent);text-decoration:none">${esc(r.email)}</a>`);
    if (r.line) fields += detailRow('💬', 'LINE', esc(r.line));
  } else if (r.type === 'dm') {
    if (r.company) fields += detailRow('🏢', '來源', clickableCompany(r.company));
    if (r.keywords) fields += detailRow('🔑', '關鍵字', esc(r.keywords));
  } else if (r.type === 'lecture') {
    if (r.speaker) fields += detailRow('🎤', '講者', esc(r.speaker));
    if (r.keywords) fields += detailRow('🔑', '關鍵字', esc(r.keywords));
    if (r.transcript) fields += detailRow('📝', '逐字稿', `${r.transcript.length} 字`);
  } else {
    if (r.keywords) fields += detailRow('🔑', '關鍵字', esc(r.keywords));
  }
  if (r.venue) fields += detailRow('📍', '場合', clickableVenue(r.venue));
  if (r.category) fields += detailRow('🗂️', '分類', `${catIcon(r.category)} ${esc(r.category)}`);
  fields += detailRow('⭐', '重要度', imp.label);
  if (r.followupAt) {
    const fu = followupStatus(r.followupAt);
    fields += detailRow('⏰', '跟進日', `<span class="followup-badge ${fu.kind === 'overdue' ? 'followup-overdue' : ''}">${fu.label} (${formatDate(r.followupAt)})</span>`);
  }
  fields += detailRow('📅', '新增時間', formatDateFull(r.createdAt));

  // User tags
  const tagsHtml = (r.tags && r.tags.length > 0) ? `
    <div style="margin-top:14px">
      <div class="section-label">標籤</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">
        ${r.tags.map(t => `<span class="user-tag" onclick="closeModal('detailModal');setTimeout(()=>searchByTag('${esc(t)}'),300)">${esc(t)}</span>`).join('')}
      </div>
    </div>` : '';

  // Explicit links
  const linkedHtml = `
    <div style="margin-top:18px">
      <div class="section-label">
        🔗 已連結 (${linkedRecords.length})

        ? `<div style="font-size:11px;color:var(--text3);padding:8px 0">尚未手動連結其他資料</div>`

          <div class="rel-card">

  const linkedSet = new Set(r.linkedIds || []);
  const autoRel = related.filter(x => !linkedSet.has(x.id)).slice(0, 6);
  let relatedHtml = '';
  if (autoRel.length > 0) {
    relatedHtml = `<div style="margin-top:18px">
      <div class="section-label">✦ 演算法推薦 (${autoRel.length})</div>

    if (r.summary) {
      lectureHtml += `<div style="margin-top:14px">
        <div class="section-label">📋 摘要</div>

function toggleTranscript(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const btn = el.previousElementSibling?.querySelector('.collapse-btn');
  if (el.style.display === 'none') {
    el.style.display = 'block';
    if (btn) btn.textContent = '收合 ▲';
  } else {
    el.style.display = 'none';
    if (btn) btn.textContent = '展開 ▼';
  }
}

function togglePinFromDetail(id) {
  const newState = togglePin(id);
  showToast(newState ? '✓ 已釘選' : '已取消釘選');
  openDetail(id);
}

function detailRow(icon, label, val) {
  return `<div class="detail-row"><div class="detail-row-icon">${icon}</div><div class="detail-row-label">${label}</div><div class="detail-row-val">${val}</div></div>`;
}

function linkAndRefresh(idA, idB) {
  linkRecords(idA, idB);
  showToast('✓ 已連結');
  openDetail(idA);
}
function unlinkAndRefresh(idA, idB) {
  unlinkRecords(idA, idB);
  showToast('已取消連結');
  openDetail(idA);
}

let _lastDeleted = null;
function confirmDelete(id) {
  if (!confirm('確定要刪除這筆資料？\n刪除後 5 秒內可復原。')) return;
  const removed = deleteRecord(id);
  if (removed) {
    _lastDeleted = removed;
    closeModal('detailModal');
    render();
    showUndoBar('已刪除「' + (removed.name || '未命名') + '」');
  }
}

function undoLast() {
  if (!_lastDeleted) return;
  const db = loadDB();
  db.unshift(_lastDeleted);
  saveDB(db);
  _lastDeleted = null;
  hideUndoBar();
  render();
  showToast('✓ 已復原');
}

// Tag input helpers
function renderTagChips() {
  const wrap = document.getElementById('tag-wrap');
  if (!wrap) return;
  const input = document.getElementById('tag-input');
  // Remove existing chips
  wrap.querySelectorAll('.tag-chip').forEach(c => c.remove());
  _currentTags.forEach((t, i) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `#${esc(t)}<span class="tag-chip-x" data-i="${i}">×</span>`;
    chip.querySelector('.tag-chip-x').onclick = () => removeTag(i);
    wrap.insertBefore(chip, input);
  });
}
function renderTagSuggest() {
  const row = document.getElementById('tag-suggest-row');
  if (!row) return;
  const input = document.getElementById('tag-input');
  const sug = suggestTags(_currentTags, input ? input.value : '');
  row.innerHTML = sug.map(t => `<span class="tag-suggest" onclick="addTag('${esc(t)}')">${esc(t)}</span>`).join('');
}
function addTag(t) {
  t = (t || '').trim().replace(/^#/, '');
  if (!t) return;
  if (_currentTags.includes(t)) return;
  _currentTags.push(t);
  const input = document.getElementById('tag-input');
  if (input) input.value = '';
  renderTagChips();
  renderTagSuggest();
}
function removeTag(i) {
  _currentTags.splice(i, 1);
  renderTagChips();
  renderTagSuggest();
}
function onTagKey(ev) {
  const input = ev.target;
  if (ev.key === 'Enter' || ev.key === ',' || ev.key === '，') {
    ev.preventDefault();
    if (input.value.trim()) addTag(input.value);
  } else if (ev.key === 'Backspace' && !input.value && _currentTags.length > 0) {
    removeTag(_currentTags.length - 1);
  }
}

let _currentImp = 1;
function setImp(n) {
  _currentImp = n;
  document.querySelectorAll('.star-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.imp) <= n);
  });
}

function gv(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

function submitForm(type) {
  // Commit any pending tag input
  const tagInput = document.getElementById('tag-input');
  if (tagInput && tagInput.value.trim()) addTag(tagInput.value);

  const name = gv('f-name');
  if (!name) { showToast('請填寫名稱'); return; }

  const followupAtRaw = gv('f-followup');
  const rec = {
    type,
    name,
    category: gv('f-category') || '其他',
    venue: gv('f-venue'),
    note: gv('f-note'),
    importance: _currentImp,
    tags: [..._currentTags],
    followupAt: followupAtRaw ? new Date(followupAtRaw).toISOString() : null,
  };
  if (type === 'contact') {
    rec.company = gv('f-company');
    rec.title = gv('f-title');
    rec.phone = gv('f-phone');
    rec.email = gv('f-email');
    rec.line = gv('f-line');
  } else if (type === 'dm') {
    rec.company = gv('f-company');
    rec.keywords = gv('f-keywords');
  } else if (type === 'lecture') {
    rec.speaker = gv('f-speaker');
    rec.transcript = gv('f-transcript');
    rec.summary = gv('f-summary');
    rec.keypoints = gv('f-keypoints').split('\n').map(s => s.trim()).filter(Boolean);
    rec.actionItems = gv('f-actions').split('\n').map(s => s.trim()).filter(Boolean);
    rec.keywords = gv('f-keywords');
  } else {
    rec.keywords = gv('f-keywords');
    rec.content = gv('f-content');
  }

  // Duplicate detection (only for contacts and only when not editing)
  if (!editingId && type === 'contact') {
    const dups = findDuplicates(rec, null);
    if (dups.length > 0 && !document.getElementById('dup-confirmed')) {
      showDupWarning(dups, type);
      return;
    }
  }

  if (editingId) {
    if (_ocrText) rec.ocrText = _ocrText;
    updateRecord(editingId, rec);
    closeModal('addModal');
    editingId = null;
    _ocrText = '';
    render();
    showToast('✓ 已更新');
  } else {
    rec.ocrText = _ocrText || '';
    addRecord(rec);
    _ocrText = '';
    closeModal('addModal');
    render();
    showToast('✓ 已儲存');
  }
}

function showDupWarning(dups, type) {
  const host = document.getElementById('dup-warn-host');
  if (!host) return;
  host.innerHTML = `<div class="dup-warn">
    <div class="dup-warn-title">⚠️ 可能是重複資料</div>
    <div>系統發現 ${dups.length} 筆相似紀錄：</div>

// IMAGE UTILS — EXIF rotation fix
// ══════════════════════════════════════════════════════════════
let _ocrText = '';
let _currentScanType = '';

function triggerUpload() {
  document.getElementById('fileInput').click();
