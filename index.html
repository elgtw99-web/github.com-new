function getExifOrientation(buffer) {
  const view = new DataView(buffer);
  if (view.getUint16(0, false) !== 0xFFD8) return 1;
  let offset = 2;
  while (offset < view.byteLength) {
    const marker = view.getUint16(offset, false);
    offset += 2;
    if (marker === 0xFFE1) {
      if (view.getUint32(offset + 2, false) !== 0x45786966) return 1;
      const little = view.getUint16(offset + 8, false) === 0x4949;
      const ifdOffset = view.getUint32(offset + 12, little);
      const entries = view.getUint16(offset + 8 + ifdOffset, little);
      for (let i = 0; i < entries; i++) {
        const tag = view.getUint16(offset + 8 + ifdOffset + 2 + i * 12, little);
        if (tag === 0x0112) return view.getUint16(offset + 8 + ifdOffset + 2 + i * 12 + 8, little);
      }
    }
    if ((marker & 0xFF00) !== 0xFF00) break;
    offset += view.getUint16(offset, false);
  }
  return 1;
}

function fixOrientation(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const arrayBuffer = e.target.result;
      const orientation = getExifOrientation(arrayBuffer);
      const blob = new Blob([arrayBuffer], { type: file.type });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let w = img.naturalWidth, h = img.naturalHeight;
        if ([5,6,7,8].includes(orientation)) { canvas.width = h; canvas.height = w; }
        else { canvas.width = w; canvas.height = h; }
        switch(orientation) {
          case 2: ctx.transform(-1,0,0,1,w,0); break;
          case 3: ctx.transform(-1,0,0,-1,w,h); break;
          case 4: ctx.transform(1,0,0,-1,0,h); break;
          case 5: ctx.transform(0,1,1,0,0,0); break;
          case 6: ctx.transform(0,1,-1,0,h,0); break;
          case 7: ctx.transform(0,-1,-1,0,h,w); break;
          case 8: ctx.transform(0,-1,1,0,0,w); break;
        }
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = url;
    };
    reader.readAsArrayBuffer(file);
  });
}

// Clean common subtitle formats (SRT, VTT) → plain transcript
function cleanSubtitles(text, ext) {
  if (ext !== 'srt' && ext !== 'vtt') return text;
  return text
    .replace(/^WEBVTT.*$/m, '')                             // VTT header
    .replace(/^NOTE\b.*$/gm, '')                            // VTT comments
    .replace(/^\d+\s*$/gm, '')                              // SRT cue numbers
    .replace(/\d{2}:\d{2}:\d{2}[,.]\d{3}\s*-->\s*\d{2}:\d{2}:\d{2}[,.]\d{3}.*$/gm, '') // timestamps
    .replace(/<[^>]+>/g, '')                                // inline tags
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')         // basic entities
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function updateTranscriptStats() {
  const ta = document.getElementById('f-transcript');
  const stats = document.getElementById('transcript-stats');
  if (!ta || !stats) return;
  const len = ta.value.length;
  if (len === 0) { stats.textContent = ''; return; }
  // rough reading time estimate: Mandarin ~300字/分鐘
  const mins = Math.max(1, Math.round(len / 300));
  stats.textContent = `${len.toLocaleString()} 字 · 約 ${mins} 分鐘閱讀`;
}

function handleTranscriptUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const sizeKB = (file.size / 1024).toFixed(1);
  // soft size limit: 2 MB of text (≈ 600k chars)
  if (file.size > 2 * 1024 * 1024) {
    if (!confirm(`檔案較大（${sizeKB} KB），AI 分析可能會慢，仍要繼續？`)) {
      input.value = '';
      return;
    }
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const raw = e.target.result || '';
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const cleaned = cleanSubtitles(raw, ext);
    const ta = document.getElementById('f-transcript');
    if (ta) {
      // If textarea already has content, append; otherwise replace
      if (ta.value.trim()) {
        if (!confirm('逐字稿欄位已有內容，要替換還是附加？\n\n確定 = 替換\n取消 = 附加在後面')) {
          ta.value = ta.value.trimEnd() + '\n\n' + cleaned;
        } else {
          ta.value = cleaned;
        }
      } else {
        ta.value = cleaned;
      }
    }
    // Show file info badge
    const info = document.getElementById('transcriptFileInfo');
    if (info) {
      info.innerHTML = `<div class="transcript-file-info">
        <span style="font-size:14px">✓</span>
        <span class="name">${esc(file.name)}</span>
        <span class="meta">${sizeKB} KB · ${cleaned.length.toLocaleString()} 字</span>
      </div>`;
    }
    updateTranscriptStats();
    // If title is empty, use filename (without extension) as default
    const nameEl = document.getElementById('f-name');
    if (nameEl && !nameEl.value.trim()) {
      nameEl.value = file.name.replace(/\.[^.]+$/, '');
    }
    showToast('✓ 逐字稿已載入');
  };
  reader.onerror = () => showToast('讀檔失敗：' + (reader.error?.message || '未知錯誤'));
  reader.readAsText(file, 'utf-8');
  // Allow re-selecting the same file later
  input.value = '';
}

function extractFromTranscript() {
  const transcript = (document.getElementById('f-transcript')?.value || '').trim();
  if (!transcript) { showToast('請先上傳或貼上逐字稿'); return; }
  if (transcript.length < 30) {
    if (!confirm('逐字稿很短（少於 30 字），AI 可能抓不到重點。仍要分析？')) return;
  }

  const btn = document.getElementById('ai-extract-btn');
  const result = document.getElementById('ai-result');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> AI 分析中（約 5-15 秒）…';
  }

  const prompt = `這是一段上課/講座/會議的逐字稿（繁體中文，可能有語音辨識的小錯誤，例如同音字錯誤）。請依下列 JSON 結構回傳分析：

{
  "summary": "整體摘要，3-5 句完整段落，繁體中文",
  "keypoints": ["重點 1", "重點 2", "重點 3", "重點 4", "重點 5"],
  "actionItems": ["可採取的行動或待辦 1", "..."],
  "keywords": "5-8 個關鍵字，逗號分隔"
}

要求：
- 全部用繁體中文
- 如果語音辨識有明顯錯字，在摘要與重點中自然修正
- 重點請涵蓋講者主要論點，每條 1-2 句話，5-8 條為宜
- 如果沒有明確行動項目，actionItems 可以是空陣列 []
- 只回傳純 JSON，不要 markdown 標記、不要其他說明

${transcript}`;

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 2000,
      messages: [{ role: 'user', content: prompt }]
    })
  })
  .then(r => r.json())
  .then(data => {
    const text = (data.content || []).map(b => b.text || '').join('');
    let parsed = null;
    try {
      const clean = text.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(clean);
    } catch (e) { /* fall through */ }

    if (parsed) {
      const set = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.value = val; };
      set('f-summary', parsed.summary || '');
      set('f-keypoints', (parsed.keypoints || []).join('\n'));
      set('f-actions', (parsed.actionItems || []).join('\n'));
      const kwEl = document.getElementById('f-keywords');
      if (parsed.keywords && kwEl && !kwEl.value.trim()) kwEl.value = parsed.keywords;
      if (result) result.style.display = 'block';
      showToast('✓ AI 已抓出重點');
      if (result) result.scrollIntoView({ behavior: 'smooth', block: 'start' });

      showToast('AI 回傳格式錯誤，請重試');
      console.warn('AI raw response:', text);
    }
    if (btn) { btn.disabled = false; btn.innerHTML = '🤖 重新分析'; }
  })
  .catch(err => {
    showToast('分析失敗：' + err.message);

  });

function openModal(id) {
  const el = document.getElementById(id);
  el.classList.add('open');
  el.onclick = e => { if (e.target === el) closeModal(id); };
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  if (id === 'addModal') {
    editingId = null;
    _ocrText = '';
    _currentTags = [];
  }
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function formatDateFull(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

let _undoTimer = null;
let _undoCountdown = null;
function showUndoBar(msg) {
  const bar = document.getElementById('undoBar');
  document.getElementById('undoMsg').textContent = msg;
  bar.classList.add('show');
  let s = 5;
  document.getElementById('undoTimer').textContent = s;
  clearInterval(_undoCountdown);
  _undoCountdown = setInterval(() => {
    s--;
    if (s <= 0) {
      hideUndoBar();
    } else {
      document.getElementById('undoTimer').textContent = s;
    }
  }, 1000);
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => hideUndoBar(), 5000);
}
function hideUndoBar() {
  document.getElementById('undoBar').classList.remove('show');
  _lastDeleted = null;
  clearInterval(_undoCountdown);
  clearTimeout(_undoTimer);
}

function renderCatManager() {

  let html = '';

  html += `

    </div>
    <div class="form-group" style="margin-bottom:10px">
      <label class="form-label">圖示</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px" id="emoji-picker">
        ${emojiOptions.map(e=>`<button type="button" onclick="pickEmoji('${e}')" style="font-size:20px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer" id="ep-${e}">${e}</button>`).join('')}
      </div>

    <div class="form-group" style="margin-bottom:10px">

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${CAT_COLORS.map((c,i)=>`<button type="button" onclick="pickColor('${c}')" id="cp-${c}" style="padding:4px 12px;border-radius:12px;border:2px solid transparent;cursor:pointer;font-size:12px" class="${c}">Aa</button>`).join('')}
      </div>
      <input id="nc-color" type="hidden" value="${CAT_COLORS[0]}">
    </div>
    <button class="btn-primary" onclick="saveNewCat()">✓ 新增分類</button>
  </div>`;

  html += `<div class="section-label">現有分類</div>`;
  Object.entries(groups).forEach(([g, cats]) => {
    html += `<div style="margin-bottom:4px;font-size:11px;color:var(--text3);padding:4px 0;border-bottom:1px solid var(--border)">${esc(g)}</div>`;
    cats.forEach(({ name, info, isCustom }) => {
      const count = usageCounts[name] || 0;
      html += `<div style="display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border)">
        <span style="font-size:18px">${info.icon}</span>
        <span class="tag ${info.color}" style="flex:1">${esc(name)}</span>
        <span style="font-size:11px;color:var(--text3)">${count ? count+'筆' : ''}</span>
        ${isCustom ? `<button onclick="deleteCustomCat('${esc(name)}')" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px" title="刪除">×</button>` : '<span style="width:26px"></span>'}
      </div>`;
    });
    html += `<div style="margin-bottom:10px"></div>`;
  });

  document.getElementById('catModalBody').innerHTML = html;
  pickColor(CAT_COLORS[0], true);
}

let _selEmoji = '📌', _selColor = CAT_COLORS[0];
function pickEmoji(e) {
  _selEmoji = e;
  document.getElementById('nc-icon').value = e;
  document.querySelectorAll('[id^="ep-"]').forEach(b => b.style.background = 'var(--surface)');
  const btn = document.getElementById('ep-' + e);
  if (btn) btn.style.background = 'var(--accent-glow)';
}
function pickColor(c, silent) {
  _selColor = c;
  document.getElementById('nc-color').value = c;
  document.querySelectorAll('[id^="cp-"]').forEach(b => b.style.borderColor = 'transparent');
  const btn = document.getElementById('cp-' + c);
  if (btn) btn.style.borderColor = 'var(--accent)';
}

function saveNewCat() {
  const name = document.getElementById('nc-name').value.trim();
  if (!name) { showToast('請輸入分類名稱'); return; }
  CAT_MAP = getCAT_MAP();
  if (CAT_MAP[name]) { showToast('此分類已存在'); return; }
  const group = document.getElementById('nc-group').value.trim() || '其他';
  const icon = _selEmoji || '📌';
  const color = _selColor || CAT_COLORS[0];
  const custom = loadCustomCats();
  custom[name] = { color, icon, group };
  saveCustomCats(custom);
  CAT_MAP = getCAT_MAP();
  showToast('✓ 分類已新增');
  renderCatManager();
}

function deleteCustomCat(name) {
  const count = getAll().filter(r => r.category === name).length;
  const msg = count > 0 ? `「${name}」已有 ${count} 筆資料使用中，確定刪除分類？（資料不會被刪除）` : `確定刪除「${name}」分類？`;
  if (!confirm(msg)) return;
  const custom = loadCustomCats();
  delete custom[name];
  saveCustomCats(custom);
  CAT_MAP = getCAT_MAP();
  showToast('已刪除分類');
  renderCatManager();
}
