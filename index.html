function handleImport(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.records || !Array.isArray(data.records)) throw new Error('格式錯誤');
      const choice = confirm(`匯入 ${data.records.length} 筆資料\n\n按「確定」= 合併（保留現有資料，跳過 ID 重複的）\n按「取消」= 取消\n\n如需「完全覆蓋」，請先清空所有資料再匯入。`);
      if (!choice) { input.value = ''; return; }
      // Merge by ID
      const existing = loadDB();
      const existingIds = new Set(existing.map(r => r.id));
      const newRecords = data.records.filter(r => !existingIds.has(r.id));
      const merged = [...newRecords, ...existing];
      saveDB(merged);
      if (data.customCategories) {
        const cur = loadCustomCats();
        saveCustomCats({ ...cur, ...data.customCategories });
        CAT_MAP = getCAT_MAP();
      }
      closeModal('menuModal');
      render();
      showToast(`✓ 已匯入 ${newRecords.length} 筆新資料`);
    } catch (err) {
      showToast('匯入失敗：' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file);
}

function confirmClearAll() {

// Lazy-load script (CDN); cached after first load
function loadScript(url) {
  window.__loadedScripts = window.__loadedScripts || {};
  if (window.__loadedScripts[url]) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => { window.__loadedScripts[url] = true; resolve(); };
    s.onerror = () => reject(new Error('無法載入函式庫：' + url));
    document.head.appendChild(s);
  });
}

// Mammoth.js (DOCX → text)
async function ensureMammoth() {
  if (window.mammoth) return;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
}
async function extractDocxText(file) {
  await ensureMammoth();
  const buffer = await file.arrayBuffer();
  const result = await window.mammoth.extractRawText({ arrayBuffer: buffer });
  return (result.value || '').trim();
}

// JSZip (PPTX is a zip of XML) → per-slide text
async function ensureJSZip() {
  if (window.JSZip) return;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
}
function decodeXmlEntities(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
          .replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}
async function extractPptxText(file) {
  await ensureJSZip();
  const buffer = await file.arrayBuffer();
  const zip = await window.JSZip.loadAsync(buffer);
  const slidePaths = Object.keys(zip.files)
    .filter(p => /^ppt\/slides\/slide\d+\.xml$/.test(p))
    .sort((a, b) => (parseInt(a.match(/slide(\d+)\.xml/)[1], 10)) - (parseInt(b.match(/slide(\d+)\.xml/)[1], 10)));
  const out = [];
  for (let i = 0; i < slidePaths.length; i++) {
    const xml = await zip.files[slidePaths[i]].async('string');
    const runs = [];
    xml.replace(/<a:t>([\s\S]*?)<\/a:t>/g, (m, t) => { runs.push(decodeXmlEntities(t)); return m; });
    const slideText = runs.join(' ').replace(/\s+/g, ' ').trim();
    out.push(`【投影片 ${i + 1}】${slideText}`);
  }
  return { text: out.join('\n\n').trim(), slideCount: slidePaths.length };
}

// pdf.js (PDF → text for lecture transcripts)
async function ensurePdfJs() {
  if (window.pdfjsLib) return;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
}
async function extractPdfText(file) {
  await ensurePdfJs();
  const buffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    pages.push(content.items.map(it => it.str).join(' '));
  }
  return pages.join('\n\n').trim();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result || '';
      const comma = result.indexOf(',');
      resolve(comma > -1 ? result.slice(comma + 1) : result);
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function fileTypeOf(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const mime = (file.type || '').toLowerCase();
  if (mime.startsWith('image/') || ['jpg','jpeg','png','gif','webp','heic','heif','bmp'].includes(ext)) return 'image';
  if (mime === 'application/pdf' || ext === 'pdf') return 'pdf';
  if (ext === 'docx' || mime.includes('wordprocessingml')) return 'docx';
  if (ext === 'doc' || mime === 'application/msword') return 'doc-legacy';
  return 'unknown';
}

function getExifOrientation(buffer) {
  const view = new DataView(buffer);
  if (view.getUint16(0, false) !== 0xFFD8) return 1;
  let offset = 2;
  while (offset < view.byteLength) {
    const marker = view.getUint16(offset, false);
    offset += 2;
    if (marker === 0xFFE1) {
      if (view.getUint32(offset + 2, false) !== 0x45786966) return 1;
      const little = view.getUint16(offset + 8, false) === 0x4949;
      const ifdOffset = view.getUint32(offset + 12, little);
      const entries = view.getUint16(offset + 8 + ifdOffset, little);
      for (let i = 0; i < entries; i++) {
        const tag = view.getUint16(offset + 8 + ifdOffset + 2 + i * 12, little);
        if (tag === 0x0112) return view.getUint16(offset + 8 + ifdOffset + 2 + i * 12 + 8, little);
      }
    }
    if ((marker & 0xFF00) !== 0xFF00) break;
    offset += view.getUint16(offset, false);
  }
  return 1;
}

function fixOrientation(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const arrayBuffer = e.target.result;
      const orientation = getExifOrientation(arrayBuffer);
      const blob = new Blob([arrayBuffer], { type: file.type });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let w = img.naturalWidth, h = img.naturalHeight;
        if ([5,6,7,8].includes(orientation)) { canvas.width = h; canvas.height = w; }
        else { canvas.width = w; canvas.height = h; }
        switch(orientation) {
          case 2: ctx.transform(-1,0,0,1,w,0); break;
          case 3: ctx.transform(-1,0,0,-1,w,h); break;
          case 4: ctx.transform(1,0,0,-1,0,h); break;
          case 5: ctx.transform(0,1,1,0,0,0); break;
          case 6: ctx.transform(0,1,-1,0,h,0); break;
          case 7: ctx.transform(0,-1,-1,0,h,w); break;
          case 8: ctx.transform(0,-1,1,0,0,w); break;
        }
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      };
      img.src = url;
    };
    reader.readAsArrayBuffer(file);
  });
}

function handleScan(input, type) {
  const file = input.files[0];
  if (!file) return;
  _currentScanType = type;
  const kind = fileTypeOf(file);
  if (kind === 'unknown') {
    showToast('不支援的檔案類型，請選圖片 / PDF / Word');
    input.value = '';
    return;
  }
  if (kind === 'doc-legacy') {
    showToast('舊版 .doc 暫不支援，請另存為 .docx 或 PDF');
    input.value = '';
    return;
  }
  if (kind === 'image') scanImage(file, type);
  else if (kind === 'pdf') scanPdf(file, type);
  else if (kind === 'docx') scanDocx(file, type);
  input.value = '';
}

// Render a "what we're reading" banner for non-image files
function renderFileBanner(file, label) {
  const icon = label === 'PDF' ? '📄' : label === 'Word' ? '📝' : '📎';
  const kb = (file.size / 1024).toFixed(1);
  return `<div class="transcript-file-info" style="margin-bottom:8px">
    <span style="font-size:18px">${icon}</span>
    <span class="name">${esc(file.name)}</span>

}

// ── Image scan with manual rotate + re-recognise ──────────────
let _scan = { dataUrl: '', type: '', running: false };

function scanImage(file, type) {
  const preview = document.getElementById('ocrPreview');
  preview.innerHTML = `<div class="ocr-result"><span class="spinner"></span> 處理照片中…</div>`;
  fixOrientation(file).then(dataUrl => {
    _scan = { dataUrl, type, running: false };
    renderScanPreview();
    runScanOcr(); // auto-attempt once; user can rotate + retry if wrong
  });
}

function renderScanPreview(statusHtml) {
  const preview = document.getElementById('ocrPreview');
  if (!preview || !_scan.dataUrl) return;
  preview.innerHTML = `
    <img src="${_scan.dataUrl}" style="width:100%;border-radius:8px;margin-bottom:6px;max-height:240px;object-fit:contain;background:#000">
    <div class="scan-toolbar">
      <button type="button" class="scan-tool-btn" onclick="rotateScan(-90)">↺ 左轉</button>
      <button type="button" class="scan-tool-btn" onclick="rotateScan(90)">↻ 右轉</button>
      <button type="button" class="scan-tool-btn primary" onclick="runScanOcr()">🔍 重新辨識</button>
    </div>
    <div style="font-size:12px;color:var(--text2);margin:2px 0 0;line-height:1.5">📌 名片若是斜的或顛倒，先轉正再按「重新辨識」會準很多。</div>
    <div id="ocrStatus">${statusHtml || ''}</div>`;
}

function rotateDataUrl(dataUrl, deg) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const ctx = c.getContext('2d');
      if (Math.abs(deg) % 180 === 90) { c.width = img.height; c.height = img.width; }
      else { c.width = img.width; c.height = img.height; }
      ctx.translate(c.width / 2, c.height / 2);
      ctx.rotate(deg * Math.PI / 180);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      resolve(c.toDataURL('image/jpeg', 0.92));
    };
    img.src = dataUrl;
  });
}

async function rotateScan(deg) {
  if (!_scan.dataUrl) return;
  _scan.dataUrl = await rotateDataUrl(_scan.dataUrl, deg);
  renderScanPreview();
}

function clearScanFields(type) {
  const ids = (type === 'contact')
    ? ['f-name', 'f-company', 'f-title', 'f-phone', 'f-email', 'f-note']
    : ['f-name', 'f-company', 'f-keywords', 'f-note'];
  ids.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
}

function runScanOcr() {
  if (!_scan.dataUrl || _scan.running) return;
  _scan.running = true;
  const status = document.getElementById('ocrStatus');
  if (status) status.innerHTML = `<div class="ocr-result"><span class="spinner"></span> AI 辨識中…</div>`;
  clearScanFields(_scan.type); // avoid leaving stale/wrong values from a previous attempt
  const base64 = _scan.dataUrl.split(',')[1];
  const target = document.getElementById('ocrStatus') || document.getElementById('ocrPreview');
  callOcr(_scan.type, [
    { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
    { type: 'text', text: OCR_PROMPTS[_scan.type] }
  ], target).finally(() => { _scan.running = false; });
}

function scanPdf(file, type) {
  const preview = document.getElementById('ocrPreview');
  preview.innerHTML = renderFileBanner(file, 'PDF') +
    `<div class="ocr-result"><span class="spinner"></span> 讀取 PDF 並 AI 辨識中…</div>`;
  fileToBase64(file).then(base64 => {
    callOcr(type, [
      { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64 } },
      { type: 'text', text: OCR_PROMPTS[type] }
    ], preview);
  }).catch(err => {
    preview.querySelector('.ocr-result').outerHTML =
      `<div class="ocr-result" style="color:var(--red)">讀取失敗：${esc(err.message)}</div>`;
  });
}

async function scanDocx(file, type) {
  const preview = document.getElementById('ocrPreview');
  preview.innerHTML = renderFileBanner(file, 'Word') +
    `<div class="ocr-result"><span class="spinner"></span> 解析 Word 文件中…</div>`;
  try {
    const text = await extractDocxText(file);
    if (!text) throw new Error('文件中沒有可辨識的文字');
    preview.querySelector('.ocr-result').outerHTML =
      `<div class="ocr-result"><span class="spinner"></span> 已抓出 ${text.length} 字，AI 辨識中…</div>`;
    callOcr(type, [
      { type: 'text', text: OCR_PROMPTS[type] + '\n\n以下是文件內容：\n\n' + text }
    ], preview, /*textMode*/ true);
  } catch (err) {
    preview.querySelector('.ocr-result').outerHTML =
      `<div class="ocr-result" style="color:var(--red)">解析 Word 失敗：${esc(err.message)}</div>`;
  }
}

// Shared: send to Claude API and fill form
function callOcr(type, contentBlocks, preview, textMode) {
  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: aiHeaders(),
    body: JSON.stringify({
      model: AI_MODEL,
      max_tokens: 1500,
      messages: [{ role: 'user', content: contentBlocks }]
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data && data.error) throw new Error(data.error.message || 'API 錯誤');
    const text = (data.content || []).map(b => b.text || '').join('');
    const parsed = parseJSON(text); // tolerant: handles prose/markdown around the JSON

    // Remove only the spinner result; keep image/banner above
    const spinner = preview.querySelector('.ocr-result');
    if (spinner) spinner.remove();

    if (parsed) {
      const set = (id, val) => { const el = document.getElementById(id); if (el && val) el.value = val; };
      if (type === 'contact') {
        set('f-name', parsed.name);
        set('f-company', parsed.company);
        set('f-title', parsed.title);
        set('f-phone', parsed.phone);
        set('f-email', parsed.email);
        set('f-note', parsed.note);
      } else {
        set('f-name', parsed.name);
        set('f-company', parsed.company);
        set('f-keywords', parsed.keywords);
        set('f-note', parsed.note);
      }
      _ocrText = text;
      preview.insertAdjacentHTML('beforeend',
        `<div class="ocr-result"><div class="ocr-label">✓ 辨識完成，欄位已自動填入</div>請確認並修正上方欄位內容。</div>`);
    } else {
      _ocrText = text;
      preview.insertAdjacentHTML('beforeend',
        `<div class="ocr-result"><div class="ocr-label">辨識結果（請手動對照填入）</div>${esc(text).replace(/\n/g,'<br>')}</div>`);
    }
  })
  .catch(err => {
    const spinner = preview.querySelector('.ocr-result');
    if (spinner) spinner.remove();
    preview.insertAdjacentHTML('beforeend',
      `<div class="ocr-result" style="color:var(--red)">辨識失敗：${esc(aiErrorHint(err))}<br><small>你仍可手動填寫欄位。</small></div>`);
  });
}

// Clean common subtitle formats (SRT, VTT) → plain transcript
function cleanSubtitles(text, ext) {
  if (ext !== 'srt' && ext !== 'vtt') return text;
  return text
    .replace(/^WEBVTT.*$/m, '')                             // VTT header
    .replace(/^NOTE\b.*$/gm, '')                            // VTT comments
    .replace(/^\d+\s*$/gm, '')                              // SRT cue numbers
    .replace(/\d{2}:\d{2}:\d{2}[,.]\d{3}\s*-->\s*\d{2}:\d{2}:\d{2}[,.]\d{3}.*$/gm, '') // timestamps
    .replace(/<[^>]+>/g, '')                                // inline tags
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')         // basic entities
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function updateTranscriptStats() {
  const ta = document.getElementById('f-transcript');
  const stats = document.getElementById('transcript-stats');
  if (!ta || !stats) return;
  const len = ta.value.length;
  if (len === 0) { stats.textContent = ''; return; }
  // rough reading time estimate: Mandarin ~300字/分鐘
  const mins = Math.max(1, Math.round(len / 300));
  stats.textContent = `${len.toLocaleString()} 字 · 約 ${mins} 分鐘閱讀`;
}

// ── Slide-deck upload (PDF / PPTX) ─────────────────────────────
function updateSlidesStats() {
  const ta = document.getElementById('f-slides');
  const stats = document.getElementById('slides-stats');
  if (!ta || !stats) return;
  const txt = ta.value;
  if (!txt.length) { stats.textContent = ''; return; }
  const slideCount = (txt.match(/【投影片/g) || []).length;
  stats.textContent = (slideCount ? `${slideCount} 頁 · ` : '') + `${txt.length.toLocaleString()} 字`;
}

function handleSlidesUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const mime = (file.type || '').toLowerCase();
  const isPdf = mime === 'application/pdf' || ext === 'pdf';
  const isPptx = ext === 'pptx' || mime.includes('presentationml');
  const sizeKB = (file.size / 1024).toFixed(1);
  const info = document.getElementById('slidesFileInfo');

  if (ext === 'ppt') { showToast('舊版 .ppt 暫不支援，請另存為 .pptx 或匯出 PDF'); input.value = ''; return; }
  if (!isPdf && !isPptx) { showToast('請上傳 PDF 或 PPTX 簡報檔'); input.value = ''; return; }
  if (file.size > 15 * 1024 * 1024) {
    if (!confirm(`簡報較大（${sizeKB} KB），解析可能較慢，仍要繼續？`)) { input.value = ''; return; }
  }

  if (info) {
    info.innerHTML = `<div class="transcript-file-info" style="background:var(--surface2);color:var(--text2);border-left-color:var(--text3)">
      <span style="font-size:14px"><span class="spinner" style="border-color:rgba(0,0,0,.15);border-top-color:var(--text)"></span></span>
      <span class="name">${esc(file.name)}</span>
      <span class="meta">解析中…</span>
    </div>`;
  }

  const finish = (text, label, slideCount) => {
    const ta = document.getElementById('f-slides');
    if (ta) {
      if (ta.value.trim()) {
        if (!confirm('簡報欄位已有內容，要替換還是附加？\n\n確定 = 替換\n取消 = 附加在後面')) {
          ta.value = ta.value.trimEnd() + '\n\n' + text;
        } else {
          ta.value = text;
        }
      } else {
        ta.value = text;
      }
    }
    if (info) {
      info.innerHTML = `<div class="transcript-file-info">
        <span style="font-size:14px">✓</span>
        <span class="name">${esc(file.name)}</span>
        <span class="meta">${sizeKB} KB · ${label}${slideCount ? ' · ' + slideCount + ' 頁' : ''}</span>
      </div>`;
    }
    updateSlidesStats();
    const nameEl = document.getElementById('f-name');
    if (nameEl && !nameEl.value.trim()) nameEl.value = file.name.replace(/\.[^.]+$/, '');
    showToast('✓ 簡報已載入，按「AI 摘要」即可整理重點');
  };

  const onError = (err) => {
    if (info) {
      info.innerHTML = `<div class="transcript-file-info" style="background:var(--red-bg);color:var(--red);border-left-color:var(--red)">
        <span style="font-size:14px">✗</span>
        <span class="name">${esc(file.name)}</span>
        <span class="meta">解析失敗</span>
      </div>`;
    }
    showToast('讀取簡報失敗：' + (err?.message || '未知錯誤'));
  };

  if (isPdf) {
    extractPdfText(file).then(text => {
      if (!text) return onError(new Error('PDF 沒有可抓出的文字（可能是純圖片掃描檔）'));
      finish(text, 'PDF');
    }).catch(onError).finally(() => { input.value = ''; });
  } else {
    extractPptxText(file).then(({ text, slideCount }) => {
      if (!text) return onError(new Error('PPTX 內沒有抓到文字'));
      finish(text, 'PPTX', slideCount);
    }).catch(onError).finally(() => { input.value = ''; });
  }
}

// ── Export a single record (e.g. a deck) as Markdown for cloud backup ──
function exportRecordMarkdown(id) {
  const r = getById(id);
  if (!r) return;
  const lines = [];
  lines.push('# ' + (r.name || '未命名'));
  lines.push('');
  const meta = [];
  if (r.speaker) meta.push('**講者／主講：** ' + r.speaker);
  if (r.venue) meta.push('**會議／場合：** ' + r.venue);
  if (r.company) meta.push('**公司／來源：** ' + r.company);
  if (r.category) meta.push('**分類：** ' + r.category);
  meta.push('**重要度：** ' + ((IMP_MAP[r.importance || 1] || {}).label || ''));
  if (r.tags && r.tags.length) meta.push('**標籤：** ' + r.tags.join('、'));
  meta.push('**建立時間：** ' + formatDateFull(r.createdAt));
  lines.push(meta.join('  \n'));
  lines.push('');
  if (r.summary) { lines.push('## 摘要', '', r.summary, ''); }
  if (r.keypoints && r.keypoints.length) { lines.push('## 重點', '', ...r.keypoints.map(k => '- ' + k), ''); }
  if (r.actionItems && r.actionItems.length) { lines.push('## 行動項目', '', ...r.actionItems.map(k => '- [ ] ' + k), ''); }
  if (r.keywords) { lines.push('## 關鍵字', '', r.keywords, ''); }
  if (r.note) { lines.push('## 備注 / 心得', '', r.note, ''); }
  if (r.slidesText) { lines.push('## 簡報內容（逐頁）', '', r.slidesText, ''); }
  if (r.transcript) { lines.push('## 逐字稿 / 會議記錄', '', r.transcript, ''); }
  const md = lines.join('\n');
  const safeName = (r.name || 'record').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 50);
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${safeName}-${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✓ 已匯出摘要檔，可存到 Google Drive / 雲端硬碟');
}

function handleTranscriptUpload(input) {

        if (!confirm('逐字稿欄位已有內容，要替換還是附加？\n\n確定 = 替換\n取消 = 附加在後面')) {
          ta.value = ta.value.trimEnd() + '\n\n' + cleaned;

        }
      } else {
        ta.value = cleaned;
      }
    }

      info.innerHTML = `<div class="transcript-file-info">
        <span style="font-size:14px">✓</span>
        <span class="name">${esc(file.name)}</span>
        <span class="meta">${sizeKB} KB · ${label} · ${cleaned.length.toLocaleString()} 字</span>
      </div>`;
    }
    updateTranscriptStats();
    const nameEl = document.getElementById('f-name');
    if (nameEl && !nameEl.value.trim()) {
      nameEl.value = file.name.replace(/\.[^.]+$/, '');
    }
    showToast('✓ 逐字稿已載入');
  };

  const onError = (err) => {
    if (info) {
      info.innerHTML = `<div class="transcript-file-info" style="background:var(--red-bg);color:var(--red);border-left-color:var(--red)">
        <span style="font-size:14px">✗</span>
        <span class="name">${esc(file.name)}</span>
        <span class="meta">解析失敗</span>
      </div>`;
    }
    showToast('讀檔失敗：' + (err?.message || '未知錯誤'));
    input.value = '';
  };

  if (isPdf) {
    extractPdfText(file).then(text => {
      if (!text) return onError(new Error('PDF 內沒有可抓出的文字（可能是掃描版）'));
      finishWithText(text, 'PDF');
    }).catch(onError).finally(() => { input.value = ''; });
  } else if (isDocx) {
    extractDocxText(file).then(text => {
      if (!text) return onError(new Error('Word 文件中沒有文字內容'));
      finishWithText(text, 'Word');
    }).catch(onError).finally(() => { input.value = ''; });
  } else {
    // Plain text formats: txt, md, srt, vtt
    const reader = new FileReader();
    reader.onload = (e) => {
      const raw = e.target.result || '';
      const cleaned = cleanSubtitles(raw, ext);
      const label = ext === 'srt' || ext === 'vtt' ? '字幕' : '文字';
      finishWithText(cleaned, label);
      input.value = '';
    };
    reader.onerror = () => { onError(reader.error); };
    reader.readAsText(file, 'utf-8');
  }
}

const AIREPORT_KEY = 'knowledgehub_aireport';

// Shared API call → returns plain text
async function callClaude(prompt, opts) {
  opts = opts || {};
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: aiHeaders(),
    body: JSON.stringify({
      model: AI_MODEL,
      max_tokens: opts.maxTokens || 1500,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  const data = await res.json();
  if (data && data.error) throw new Error(data.error.message || 'API 錯誤');
  return (data.content || []).map(b => b.text || '').join('');
}

// Tolerant JSON parse (handles ```json fences and surrounding prose)
function parseJSON(text) {
  if (!text) return null;
  const clean = String(text).replace(/```json|```/g, '').trim();
  try { return JSON.parse(clean); } catch (e) {}
  const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
  if (s > -1 && e > s) { try { return JSON.parse(clean.slice(s, e + 1)); } catch (_) {} }
  return null;
}

// One-line compact representation of a record (for whole-library prompts)
function recordSummaryLine(r) {
  const t = (TYPE_MAP[r.type] || {}).label || r.type;
  const head = [`[${t}] ${r.name || '(未命名)'}`];
  if (r.company) head.push(r.company);
  if (r.title) head.push(r.title);
  const meta = [];
  if (r.category) meta.push('分類:' + r.category);
  if (r.venue) meta.push('場合:' + r.venue);
  meta.push('重要度:' + ((IMP_MAP[r.importance || 1] || {}).label || ''));
  if (r.tags && r.tags.length) meta.push('標籤:' + r.tags.join('、'));
  const fu = followupStatus(r.followupAt);
  if (fu && (fu.kind === 'overdue' || fu.kind === 'today' || fu.kind === 'soon')) meta.push('待跟進:' + fu.label);
  let line = head.join(' / ');
  if (meta.length) line += ' | ' + meta.join(' | ');
  const extra = r.note || r.summary || r.content || r.keywords || '';
  if (extra) line += ' | ' + String(extra).replace(/\s+/g, ' ').slice(0, 120);
  return line;
}

function aiReportResultHTML(rep, meta, at) {

    renderReportHTML(rep) +
    `<button class="btn-secondary" style="margin-top:14px" onclick="runAIReport()">🔄 重新分析</button>`;
}

function renderReportHTML(rep) {
  const sec = (label, inner) => `<div style="margin-top:14px"><div class="section-label">${label}</div>${inner}</div>`;
  const ul = arr => `<ul class="kp-list">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  let h = '';

async function runAsk() {
  const q = (document.getElementById('askInput')?.value || '').trim();
  const out = document.getElementById('askResult');
  if (!out) return;
  if (!q) { showToast('請先輸入問題'); return; }
  out.innerHTML = `<div class="ai-answer"><span class="spinner"></span> AI 正在翻你的資料庫…</div>`;

  // Candidate retrieval: relevance search first, then top up with important/recent
  let cands = searchScored(q).slice(0, 30);
  const seen = new Set(cands.map(c => c.id));
  if (cands.length < 12) {
    const extra = getAll().filter(r => !isArchived(r))
      .sort((a, b) => (b.importance || 1) - (a.importance || 1) ||
        (new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt)));
    for (const r of extra) { if (!seen.has(r.id)) { cands.push(r); seen.add(r.id); } if (cands.length >= 40) break; }
  }
  if (cands.length === 0) {
    out.innerHTML = `<div class="empty"><div class="empty-icon">🗂️</div><div class="empty-text">資料庫裡還沒有資料</div></div>`;
    return;
  }

  const lines = cands.map((r, i) => `${i + 1}. ${recordSummaryLine(r)}`).join('\n');
  const prompt = `你是使用者「知識人脈庫」的智慧助理。請「只根據」下方提供的資料回答問題，用繁體中文，語氣口語、精簡、實用。
- 如果資料中找得到答案，請直接整理重點，並點名相關的人或資料名稱。
- 如果資料裡沒有相關內容，就誠實說「目前庫裡沒有相關資料」，絕對不要編造不存在的人或內容。
- 不要用 markdown 標題，直接寫成好讀的段落或條列。

問題：${q}

可參考的資料（每行一筆）：
${lines}`;

  try {
    const text = await callClaude(prompt, { maxTokens: 1200 });
    let h = `<div class="ai-answer">${esc((text || '').trim())}</div>`;
    const refs = cands.slice(0, 12);
    h += `<div class="section-label" style="margin-top:16px">📎 參考的資料（${refs.length} 筆）</div>`;
    h += refs.map(r => renderCard(r, { compact: true })).join('');
    out.innerHTML = h;
  } catch (e) {
    out.innerHTML = `<div class="ai-answer" style="border-left-color:var(--red);color:var(--red)">回答失敗：${esc(aiErrorHint(e))}</div>`;
  }
}

只回傳純 JSON，不要 markdown 或其他說明。

// Guard against losing a half-filled add/edit form by accident
function isAddFormDirty() {
  if (!document.getElementById('f-name')) return false; // type chooser, nothing to lose
  const ids = ['f-name','f-company','f-title','f-phone','f-email','f-line',
               'f-keywords','f-content','f-venue','f-note','f-speaker','f-transcript','f-slides','f-summary'];

}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function formatDateFull(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// Human-friendly relative time for cards: 今天 / 昨天 / N天前 / 月/日（跨年才顯示年份）
function relTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startThat = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((startToday - startThat) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff >= 2 && diff <= 6) return `${diff} 天前`;
  if (diff < 0 && diff >= -6) return `${-diff} 天後`;
  return d.getFullYear() === now.getFullYear()
    ? `${d.getMonth()+1}/${d.getDate()}`
    : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

// Copy to clipboard with friendly feedback (with fallback for older browsers)
function copyText(text, label) {
  if (!text) return;
  const done = () => showToast('✓ 已複製' + (label ? '：' + label : ''));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { showToast('複製失敗，請手動選取'); }
  document.body.removeChild(ta);
}

let _undoTimer = null;
let _undoCountdown = null;
function showUndoBar(msg) {
  const bar = document.getElementById('undoBar');
  document.getElementById('undoMsg').textContent = msg;
  bar.classList.add('show');
  let s = 5;
  document.getElementById('undoTimer').textContent = s;
  clearInterval(_undoCountdown);
  _undoCountdown = setInterval(() => {
    s--;
    if (s <= 0) {
      hideUndoBar();
    } else {
      document.getElementById('undoTimer').textContent = s;
    }
  }, 1000);
  clearTimeout(_undoTimer);
  _undoTimer = setTimeout(() => hideUndoBar(), 5000);
}
function hideUndoBar() {
  document.getElementById('undoBar').classList.remove('show');
  _lastDeleted = null;
  clearInterval(_undoCountdown);
  clearTimeout(_undoTimer);
}

function deleteCustomCat(name) {

  const custom = loadCustomCats();
  delete custom[name];
  saveCustomCats(custom);
  CAT_MAP = getCAT_MAP();
  showToast('已刪除分類');
  renderCatManager();
}
